<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小票夹管理器</title>
  <script>window.CONTROL_TOKEN="__CONTROL_TOKEN__";</script>
  <style>
    :root {
      --page: #f3f5f2;
      --surface: #ffffff;
      --surface-subtle: #f8faf7;
      --ink: #202521;
      --muted: #68716a;
      --line: #d8ddd8;
      --line-strong: #bec7bf;
      --green: #176b4d;
      --green-soft: #e7f2eb;
      --blue: #315f95;
      --blue-soft: #e9f0f8;
      --amber: #8a5a1c;
      --amber-soft: #f8efdf;
      --red: #aa3c32;
      --red-soft: #fae9e6;
      --shadow: 0 8px 24px rgba(31, 42, 34, 0.07);
      --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; letter-spacing: 0; }
    button:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(49, 95, 149, 0.28);
      outline-offset: 2px;
    }
    .shell { width: min(940px, 100%); margin: 0 auto; padding: 22px 24px 28px; }
    .topbar { display: flex; align-items: center; gap: 12px; min-height: 42px; }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid #0f563d;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
    }
    .brand-name { font-size: 17px; font-weight: 700; line-height: 1.25; }
    .brand-meta { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .overall-state {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .state-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
    .overall-state.is-ok { border-color: #acd0bd; color: var(--green); background: var(--green-soft); }
    .overall-state.is-ok .state-dot { background: var(--green); }
    .overall-state.is-warn { border-color: #e0c797; color: var(--amber); background: var(--amber-soft); }
    .overall-state.is-warn .state-dot { background: var(--amber); }
    .overall-state.is-error { border-color: #e0b0aa; color: var(--red); background: var(--red-soft); }
    .overall-state.is-error .state-dot { background: var(--red); }
    .product-link {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      margin-left: auto;
      padding: 5px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
    }
    .product-link:hover { color: var(--ink); text-decoration: underline; }
    .product-link + .overall-state { margin-left: 0; }
    .product-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .product-actions input[type="text"], .product-actions select, .restore-actions input[type="text"] {
      min-height: 34px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--card);
    }
    .product-actions input[type="text"] { width: 9em; letter-spacing: 0.12em; }
    .restore-actions { display: grid; gap: 8px; margin-top: 10px; }
    .restore-actions input[type="text"] { width: 100%; font-family: var(--mono); font-size: 11px; }
    /* The hidden attribute is authoritative over every display rule above —
       pair form / manage group / product link must never coexist. */
    [hidden] { display: none !important; }

    .service-band {
      margin-top: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 22px;
      min-height: 128px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 650; }
    .service-title { margin: 7px 0 0; font-size: 25px; line-height: 1.2; font-weight: 720; }
    .service-detail { margin-top: 8px; color: var(--muted); line-height: 1.45; }
    .service-actions { display: flex; align-items: center; gap: 8px; }
    .button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-weight: 650;
      white-space: nowrap;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }
    .button:hover:not(:disabled) { border-color: #8e9990; background: var(--surface-subtle); }
    .button:active:not(:disabled) { background: #edf0ed; }
    .button:disabled { cursor: default; opacity: 0.48; }
    .button-primary { border-color: var(--green); background: var(--green); color: #fff; }
    .button-primary:hover:not(:disabled) { border-color: #10573f; background: #10573f; }
    .button-danger { color: var(--red); }
    .button-primary.button-danger { border-color: #d3a39e; background: var(--surface); color: var(--red); }
    .button-primary.button-danger:hover:not(:disabled) { border-color: var(--red); background: var(--red-soft); }
    .button-icon { width: 38px; padding: 8px; font-size: 18px; }
    .icon { display: inline-grid; width: 18px; height: 18px; place-items: center; font-size: 15px; line-height: 18px; }
    .spinner { animation: spin 900ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .message {
      margin-top: 12px;
      display: none;
      align-items: flex-start;
      gap: 9px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 6px;
      line-height: 1.45;
    }
    .message.is-visible { display: flex; }
    .message-info { border-color: #b7c9dc; background: var(--blue-soft); color: #264f7a; }
    .message-error { border-color: #e0b0aa; background: var(--red-soft); color: #8e3029; }

    .section-head { margin: 24px 0 10px; display: flex; align-items: baseline; justify-content: space-between; }
    .section-head h2 { margin: 0; font-size: 15px; font-weight: 720; }
    .section-meta { color: var(--muted); font-size: 12px; }
    .task-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .task-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 190px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .task-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--surface-subtle);
      color: var(--ink);
      font-size: 17px;
    }
    .task-card:nth-child(1) .task-icon { background: var(--green-soft); color: var(--green); }
    .task-card:nth-child(2) .task-icon { background: var(--blue-soft); color: var(--blue); }
    .task-card:nth-child(3) .task-icon { background: var(--amber-soft); color: var(--amber); }
    .task-title { margin-top: 13px; font-size: 15px; font-weight: 720; }
    .task-state { min-height: 40px; margin-top: 6px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
    .task-actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 7px; }
    .task-actions .button { min-height: 34px; padding: 6px 10px; font-size: 12.5px; }

    .technical {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
    }
    .technical summary { padding: 14px 2px 8px; cursor: pointer; font-weight: 650; color: #4d5750; }
    .technical-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 2px 0 10px;
    }
    .technical-item { min-width: 0; padding: 10px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .technical-label { font-size: 11px; color: var(--muted); }
    .technical-value { margin-top: 4px; overflow-wrap: anywhere; color: var(--ink); font-family: var(--mono); font-size: 11.5px; }
    .diagnostic-lines {
      max-height: 112px;
      margin: 0 0 8px;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #202521;
      color: #dce4dd;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.55;
      user-select: text;
    }
    .footer { margin-top: 14px; color: #7a837c; font-size: 11.5px; text-align: right; }

    @media (max-width: 700px) {
      .shell { padding: 16px; }
      .service-band { grid-template-columns: 1fr; gap: 16px; }
      .service-actions { width: 100%; }
      .service-actions .button-primary { flex: 1; }
      .task-grid { grid-template-columns: 1fr; }
      .task-card { min-height: 164px; }
      .technical-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .section-meta { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">票</div>
      <div>
        <div class="brand-name">小票夹管理器</div>
        <div class="brand-meta" id="runtimeLabel">正在读取本机状态</div>
      </div>
      <a class="product-link" id="productHomeLink" href="/web" hidden>返回日常账务</a>
      <div class="overall-state" id="overallState" role="status" aria-live="polite">
        <span class="state-dot" aria-hidden="true"></span>
        <span id="overallText">检查中</span>
      </div>
    </header>

    <section class="service-band" aria-labelledby="serviceTitle">
      <div>
        <div class="eyebrow">此电脑</div>
        <h1 class="service-title" id="serviceTitle">正在检查小票夹</h1>
        <div class="service-detail" id="serviceDetail">请稍候</div>
      </div>
      <div class="service-actions">
        <button class="button button-primary manager-action" id="primaryAction" type="button" data-action="start" onclick="act(this.dataset.action, this)">
          <span class="icon" aria-hidden="true">▶</span><span>启动</span>
        </button>
        <button class="button button-icon manager-action" id="restartAction" type="button" title="重启小票夹" aria-label="重启小票夹" onclick="act('restart', this)">↻</button>
      </div>
    </section>

    <section class="service-band" aria-labelledby="productTitle">
      <div>
        <div class="eyebrow">日常账务</div>
        <h1 class="service-title" id="productTitle">桌面账本</h1>
        <div class="service-detail" id="productState">正在读取绑定状态</div>
      </div>
      <div class="service-actions product-actions">
        <span class="product-actions" id="productPairGroup" hidden>
          <input type="text" id="pairingCodeInput" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="安装器提供的 8 位码" aria-label="绑定此电脑的 8 位码">
          <button class="button button-primary" id="pairAction" type="button" onclick="pairProduct()">绑定此电脑</button>
        </span>
        <span class="product-actions" id="productManageGroup" hidden>
          <select id="ledgerSelect" aria-label="切换账本"></select>
          <button class="button" id="switchAction" type="button" onclick="switchProductLedger()">切换账本</button>
          <button class="button" id="unpairAction" type="button" onclick="unpairProduct()">解除绑定</button>
        </span>
      </div>
    </section>
    <div class="message message-error" id="productError" role="alert">
      <span aria-hidden="true">!</span><span id="productErrorText"></span>
    </div>

    <div class="message message-error" id="controlError" role="alert">
      <span aria-hidden="true">!</span><span id="controlErrorText"></span>
    </div>
    <div class="message message-info" id="actionNotice" role="status">
      <span aria-hidden="true">✓</span><span id="actionNoticeText"></span>
    </div>

    <div class="section-head">
      <h2>常用操作</h2>
      <span class="section-meta">需要时进入对应任务</span>
    </div>
    <section class="task-grid" aria-label="常用操作">
      <article class="task-card">
        <div class="task-icon" aria-hidden="true">⌁</div>
        <div class="task-title">连接设备</div>
        <div class="task-state" id="connectState">服务正常后可以生成一次性绑定码。</div>
        <div class="task-actions">
          <button class="button manager-action owner-action" id="androidAction" type="button" onclick="act('open_pairing', this)">设备绑定</button>
          <button class="button manager-action owner-action" id="iphoneAction" type="button" onclick="act('open_upload_links', this)">iPhone 上传</button>
          <button class="button manager-action owner-action" type="button" title="查看已连接设备" onclick="act('open_devices', this)">设备</button>
        </div>
      </article>

      <article class="task-card">
        <div class="task-icon" aria-hidden="true">▣</div>
        <div class="task-title">备份</div>
        <div class="task-state" id="protectState">升级前请确认最近备份可用。</div>
        <div class="task-actions">
          <button class="button manager-action" id="backupAction" type="button" onclick="act('backup', this)">立即完整备份</button>
          <button class="button manager-action owner-action" type="button" onclick="act('open_backups', this)">查看备份</button>
        </div>
        <div class="restore-actions">
          <input type="text" id="restoreGeneration" autocomplete="off" spellcheck="false" placeholder="ticketbox-backup-…" aria-label="要恢复的完整备份 generation">
          <button class="button manager-action" id="restoreAction" type="button" onclick="restoreDataset(this)">恢复所选备份</button>
        </div>
      </article>

      <article class="task-card">
        <div class="task-icon" aria-hidden="true">+</div>
        <div class="task-title">检查与自救</div>
        <div class="task-state" id="diagnosticState">导出包不包含令牌、账本内容或原始日志。</div>
        <div class="task-actions">
          <button class="button manager-action" id="diagnosticExportAction" type="button" onclick="act('export_diagnostics', this)">导出诊断包</button>
          <button class="button manager-action owner-action" type="button" onclick="act('open_diagnostics', this)">系统体检</button>
          <button class="button manager-action owner-action" type="button" title="打开小票夹设置" onclick="act('open_settings', this)">设置</button>
        </div>
      </article>
    </section>

    <details class="technical">
      <summary>技术详情</summary>
      <div class="technical-grid">
        <div class="technical-item"><div class="technical-label">后端服务</div><div class="technical-value" id="backendService">—</div></div>
        <div class="technical-item"><div class="technical-label">PostgreSQL</div><div class="technical-value" id="databaseService">—</div></div>
        <div class="technical-item"><div class="technical-label">局域网入口</div><div class="technical-value" id="lan">—</div></div>
        <div class="technical-item"><div class="technical-label">公网入口</div><div class="technical-value" id="tunnel">—</div></div>
      </div>
      <div class="diagnostic-lines" id="log" aria-label="运行诊断"></div>
    </details>
    <div class="footer" id="versionLabel"></div>
  </main>

  <script>
    let running = false;
    let refreshInFlight = false;
    let actionInFlight = false;
    let latestStatus = null;
    const $ = (id) => document.getElementById(id);

    function serviceState(state) {
      const labels = {
        running: "运行中", stopped: "已停止", start_pending: "启动中", stop_pending: "停止中",
        paused: "已暂停", missing: "未安装", unknown: "未知"
      };
      return labels[state] || state || "—";
    }

    function setOverall(kind, text) {
      const target = $("overallState");
      target.className = `overall-state${kind ? ` is-${kind}` : ""}`;
      $("overallText").textContent = text;
    }

    function setMessage(id, text) {
      const box = $(id);
      box.classList.toggle("is-visible", Boolean(text));
      $(`${id}Text`).textContent = text || "";
    }

    function applyActionAvailability(s) {
      const hasStatus = Boolean(s);
      const isRunning = hasStatus && Boolean(s.running);
      const backendReady = isRunning && Boolean(s.health);
      const productAvailable = backendReady
        && s.runtime_access_state === "available"
        && s.owner_state === "configured";
      const serviceControls = hasStatus && Boolean(s.service_controls_available);
      $("primaryAction").disabled = actionInFlight || !serviceControls;
      $("restartAction").disabled = actionInFlight || !serviceControls || !isRunning;
      document.querySelectorAll(".owner-action").forEach((button) => {
        button.disabled = actionInFlight || !productAvailable;
      });
      $("androidAction").disabled = actionInFlight || !productAvailable || s.android_binding_state !== "configured_unverified";
      $("iphoneAction").disabled = actionInFlight || !productAvailable || s.iphone_upload_state !== "configured_unverified";
      $("diagnosticExportAction").disabled = actionInFlight;
      $("backupAction").disabled = actionInFlight || !hasStatus || s.runtime_mode !== "installed" || !serviceControls;
      $("restoreAction").disabled = actionInFlight || !hasStatus || s.runtime_mode !== "installed" || !serviceControls;
      $("restoreGeneration").disabled = actionInFlight || !hasStatus || s.runtime_mode !== "installed";
      document.querySelector("main").setAttribute("aria-busy", String(actionInFlight));
    }

    function render(s) {
      latestStatus = s;
      if (s.manager_shutdown_requested) {
        actionInFlight = true;
        setOverall("warn", "管理器正在交接");
        setMessage("controlError", "安装维护即将开始，管理器会关闭，服务可能暂时不可用。");
        applyActionAvailability(s);
        setTimeout(() => window.close(), 50);
        return;
      }
      running = Boolean(s.running);
      const backendReady = running && Boolean(s.health);
      const pending = running && s.health_state === "pending";
      const mismatch = running && s.health_state === "mismatch";
      const runtimeRepairRequired = backendReady && s.runtime_access_state === "repair_required";
      const ownerRecoveryRequired = backendReady && s.owner_state === "recovery_required";
      const productAvailable = backendReady && !runtimeRepairRequired && !ownerRecoveryRequired;
      const serviceFault = s.runtime_mode === "installed" && !s.service_controls_available;
      const androidConfigured = productAvailable && s.android_binding_state === "configured_unverified";
      const iphoneConfigured = productAvailable && s.iphone_upload_state === "configured_unverified";

      if (serviceFault) {
        setOverall("error", "需要处理");
        $("serviceTitle").textContent = "小票夹需要修复";
        $("serviceDetail").textContent = "暂时无法确认小票夹状态，请先导出诊断包，再使用可信安装包手动修复。";
      } else if (!running) {
        setOverall("", "已停止");
        $("serviceTitle").textContent = "小票夹已停止";
        $("serviceDetail").textContent = "启动后可以继续使用电脑端管理功能。";
      } else if (runtimeRepairRequired) {
        setOverall("error", "需要修复安装");
        $("serviceTitle").textContent = "安装维护尚未完成";
        $("serviceDetail").textContent = "请先导出诊断包，再关闭管理器并重新运行可信安装包。";
      } else if (ownerRecoveryRequired) {
        setOverall("warn", "需要恢复身份");
        $("serviceTitle").textContent = "缺少可用拥有者身份";
        $("serviceDetail").textContent = "当前管理器不能自动重建身份，请先导出诊断包。";
      } else if (backendReady) {
        setOverall("ok", "运行正常");
        $("serviceTitle").textContent = "小票夹正在运行";
        $("serviceDetail").textContent = androidConfigured && iphoneConfigured
          ? "电脑端运行正常；手机入口已配置，仍需在手机上完成连接验证。"
          : "电脑端运行正常；手机连接尚未配置。";
      } else if (pending) {
        setOverall("warn", "正在启动");
        $("serviceTitle").textContent = "小票夹正在准备";
        $("serviceDetail").textContent = "数据库与服务正在完成启动。";
      } else {
        setOverall("error", mismatch ? "身份不匹配" : "需要处理");
        $("serviceTitle").textContent = mismatch ? "安装身份校验失败" : "小票夹没有正常响应";
        $("serviceDetail").textContent = s.health_detail || "请打开系统体检或导出诊断包。";
      }

      const primary = $("primaryAction");
      primary.dataset.action = running ? "stop" : "start";
      primary.querySelector(".icon").textContent = running ? "■" : "▶";
      primary.querySelector("span:last-child").textContent = running ? "停止" : "启动";
      primary.classList.toggle("button-danger", running);
      $("runtimeLabel").textContent = s.runtime_mode === "installed" ? "本机安装" : "开发环境 · 源码运行";

      $("connectState").textContent = runtimeRepairRequired
        ? "安装修复完成后才能连接手机。"
        : (ownerRecoveryRequired
          ? "拥有者身份恢复后才能连接手机。"
          : (!backendReady
            ? "服务正常后才能检查手机连接配置。"
        : (androidConfigured && iphoneConfigured
          ? "手机入口已配置，连接结果以手机实测为准。"
          : "当前仅本机可用，请先在设置中配置手机入口。")));
      $("protectState").textContent = s.runtime_mode === "installed"
        ? "升级前请确认最近备份可用。"
        : "开发环境不使用正式安装器维护。";
      $("diagnosticState").textContent = s.diagnostic_bundle_file ? `最近导出：${s.diagnostic_bundle_file}` : "导出包不包含令牌、账本内容或原始日志。";

      $("backendService").textContent = serviceState(s.backend_service_state);
      $("databaseService").textContent = serviceState(s.database_service_state);
      $("lan").textContent = s.lan || "—";
      $("tunnel").textContent = s.public_endpoint_state === "public_configured_unverified"
        ? "已配置，待设备验证"
        : (s.public_endpoint_state === "local_only" ? "未配置" : "未知");
      $("versionLabel").textContent = s.version ? `小票夹 ${s.version}` : "小票夹 Desktop Manager";
      setMessage("controlError", s.control_error);
      setMessage("actionNotice", s.action_notice);

      const log = $("log");
      log.replaceChildren(...(s.log || []).map((line) => {
        const row = document.createElement("div");
        row.textContent = line;
        return row;
      }));
      applyActionAvailability(s);
    }

    let productSession = null;
    let productLedgers = [];
    let productBusy = false;
    let ledgerSelectionDirty = false;
    // Ledger memberships can change outside this window; re-read the list on
    // a slow cadence (every 12th 2.5s tick ≈ 30s), never every tick.
    const PRODUCT_LEDGER_REFRESH_TICKS = 12;
    let productLedgerRefreshTick = 0;

    async function productFetch(path, options = {}) {
      const headers = {"X-Control-Token": window.CONTROL_TOKEN};
      if (options.body) headers["Content-Type"] = "application/json";
      const response = await fetch(path, {...options, headers});
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(payload.message || "product");
        error.payload = payload;
        throw error;
      }
      return payload;
    }

    function renderProduct() {
      const configured = Boolean(productSession && productSession.configured);
      const available = Boolean(latestStatus && latestStatus.product_available);
      const liveRow = configured
        ? productLedgers.find((row) => row.ledger_id === productSession.ledger_id)
        : null;
      const membershipLost = configured && productLedgers.length > 0 && !liveRow;
      const showManage = configured && !membershipLost;
      $("productHomeLink").hidden = !(showManage && available);
      $("productPairGroup").hidden = showManage;
      $("productManageGroup").hidden = !showManage;
      if (!configured) {
        $("productState").textContent = available
          ? "输入安装器提供的“绑定此电脑”码，连接桌面账本。"
          : "服务正常后可以把这台电脑连接到账本。";
        $("pairAction").disabled = productBusy || !available;
        $("pairingCodeInput").disabled = productBusy || !available;
        return;
      }
      if (membershipLost) {
        // The bound ledger vanished from the account's memberships: the stored
        // session is dead weight — offer the re-pair path, not a phantom role.
        $("productState").textContent = "原绑定已失效，请使用新的绑定码重新连接。";
        $("pairAction").disabled = productBusy || !available;
        $("pairingCodeInput").disabled = productBusy || !available;
        return;
      }
      const roleLabels = {owner: "拥有者", member: "成员", viewer: "只读"};
      // The displayed role follows the live membership row (30s cadence), not
      // the role persisted in WinCred at pair/switch time.
      const role = liveRow ? liveRow.role : productSession.role;
      $("productState").textContent =
        `${productSession.ledger_name} · ${roleLabels[role] || role} · ${productSession.account_name}`;
      const select = $("ledgerSelect");
      if (select.options.length === 0) {
        const option = document.createElement("option");
        option.value = productSession.ledger_id;
        option.textContent = productSession.ledger_name;
        select.append(option);
      }
      // A user-chosen, not-yet-switched selection survives the 2.5s refresh
      // ticks; only snap back to the session ledger when nothing is in flight.
      if (!ledgerSelectionDirty) select.value = productSession.ledger_id;
      $("switchAction").disabled = productBusy || !available || select.value === productSession.ledger_id;
      $("unpairAction").disabled = productBusy || !available;
      select.disabled = productBusy || !available;
    }

    async function loadProductSession() {
      try {
        productSession = await productFetch("/api/product/session");
      } catch (_error) {
        productSession = null;
      }
      renderProduct();
    }

    async function loadProductLedgers() {
      if (!productSession || !productSession.configured) return;
      try {
        const payload = await productFetch("/api/product/ledgers");
        productLedgers = payload.ledgers || [];
        const select = $("ledgerSelect");
        // Rebuilding options resets select.value to the first row — carry a
        // dirty user selection across the rebuild (or drop it if the ledger
        // itself vanished from the membership list).
        const inFlight = ledgerSelectionDirty ? select.value : null;
        select.replaceChildren(...productLedgers.map((row) => {
          const option = document.createElement("option");
          option.value = row.ledger_id;
          option.textContent = row.is_current ? `${row.name}（当前）` : row.name;
          return option;
        }));
        if (inFlight && [...select.options].some((option) => option.value === inFlight)) {
          select.value = inFlight;
        } else if (inFlight) {
          ledgerSelectionDirty = false;
        }
        if (!ledgerSelectionDirty) select.value = productSession.ledger_id;
      } catch (_error) {
        productLedgers = [];
      }
      renderProduct();
    }

    async function productAction(work) {
      if (productBusy) return;
      productBusy = true;
      renderProduct();
      try {
        await work();
        setMessage("productError", "");
        ledgerSelectionDirty = false;
        await loadProductSession();
        await loadProductLedgers();
      } catch (error) {
        setMessage("productError", (error && error.message && error.message !== "product")
          ? error.message
          : "未能完成桌面账本操作，请稍后重试。");
      } finally {
        productBusy = false;
        renderProduct();
      }
    }

    async function pairProduct() {
      const code = $("pairingCodeInput").value.trim();
      if (!/^\d{8}$/.test(code)) {
        setMessage("productError", "请输入安装器提供的 8 位“绑定此电脑”码。");
        return;
      }
      await productAction(async () => {
        await productFetch("/api/product/pair", {method: "POST", body: JSON.stringify({pairing_code: code})});
        $("pairingCodeInput").value = "";
      });
    }

    async function unpairProduct() {
      await productAction(async () => {
        await productFetch("/api/product/unpair", {method: "POST", body: ""});
        productLedgers = [];
        $("ledgerSelect").replaceChildren();
      });
    }

    async function switchProductLedger() {
      const ledgerId = $("ledgerSelect").value;
      if (!ledgerId || (productSession && ledgerId === productSession.ledger_id)) return;
      await productAction(async () => {
        await productFetch("/api/product/ledger/switch", {method: "POST", body: JSON.stringify({ledger_id: ledgerId})});
      });
    }

    document.addEventListener("change", (event) => {
      if (event.target !== $("ledgerSelect")) return;
      ledgerSelectionDirty = Boolean(
        productSession && $("ledgerSelect").value !== productSession.ledger_id
      );
      renderProduct();
    });

    async function refresh() {
      if (refreshInFlight) return;
      refreshInFlight = true;
      try {
        const response = await fetch("/api/status", {headers:{"X-Control-Token": window.CONTROL_TOKEN}});
        if (!response.ok) throw new Error("status");
        render(await response.json());
        await loadProductSession();
        if (productSession && productSession.configured) {
          productLedgerRefreshTick += 1;
          if (productLedgers.length === 0 || productLedgerRefreshTick >= PRODUCT_LEDGER_REFRESH_TICKS) {
            productLedgerRefreshTick = 0;
            await loadProductLedgers();
          }
        } else {
          productLedgerRefreshTick = 0;
        }
      } catch (_error) {
        latestStatus = null;
        setOverall("error", "管理器离线");
        setMessage("controlError", "管理器状态暂不可用，请稍后重试。");
        applyActionAvailability(null);
      } finally {
        refreshInFlight = false;
      }
    }

    async function act(action, button) {
      if (actionInFlight) return;
      const original = button ? button.innerHTML : "";
      const originalAriaLabel = button ? button.getAttribute("aria-label") : null;
      let actionRendered = false;
      actionInFlight = true;
      applyActionAvailability(latestStatus);
      if (button) {
        if (button.classList.contains("button-icon")) {
          button.innerHTML = '<span class="icon spinner" aria-hidden="true">↻</span>';
          button.setAttribute("aria-label", "处理中");
        } else {
          button.innerHTML = '<span class="icon spinner" aria-hidden="true">↻</span><span>处理中</span>';
        }
      }
      try {
        const response = await fetch(`/api/${action}`, {
          method: "POST",
          headers: {"X-Control-Token": window.CONTROL_TOKEN}
        });
        if (response.status === 409) throw new Error("busy");
        if (!response.ok) throw new Error("action");
        render(await response.json());
        actionRendered = true;
      } catch (error) {
        setMessage(
          "controlError",
          error.message === "busy" ? "另一项操作正在进行，请等待完成。" : "管理器未能完成操作，请稍后重试。"
        );
      } finally {
        if (button && (!actionRendered || button.id !== "primaryAction")) {
          button.innerHTML = original;
          if (originalAriaLabel === null) button.removeAttribute("aria-label");
          else button.setAttribute("aria-label", originalAriaLabel);
        }
        actionInFlight = false;
        applyActionAvailability(latestStatus);
        await refresh();
      }
    }

    async function restoreDataset(button) {
      const generation = $("restoreGeneration").value.trim();
      if (!/^ticketbox-backup-[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(generation)) {
        setMessage("controlError", "请从完整备份页面复制一个明确的 generation 名称。");
        return;
      }
      if (!window.confirm("恢复会停止服务，并用所选备份发布新的数据 generation。原数据会保留到发布成功。继续吗？")) return;
      if (actionInFlight) return;
      const original = button.innerHTML;
      actionInFlight = true;
      applyActionAvailability(latestStatus);
      button.innerHTML = '<span class="icon spinner" aria-hidden="true">↻</span><span>恢复中</span>';
      try {
        const response = await fetch("/api/restore", {
          method: "POST",
          headers: {
            "X-Control-Token": window.CONTROL_TOKEN,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({backup_generation: generation})
        });
        if (response.status === 409) throw new Error("busy");
        if (!response.ok) throw new Error("action");
        render(await response.json());
      } catch (error) {
        setMessage(
          "controlError",
          error.message === "busy" ? "另一项操作正在进行，请等待完成。" : "完整恢复结果未知；请刷新服务和数据状态后，重试同一 generation。"
        );
      } finally {
        button.innerHTML = original;
        actionInFlight = false;
        applyActionAvailability(latestStatus);
        await refresh();
      }
    }

    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
