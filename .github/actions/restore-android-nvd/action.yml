name: Restore Android NVD data
description: Restore the latest trusted Android dependency-check data.

outputs:
  cache-key:
    description: Unique key used when a trusted producer publishes refreshed data.
    value: ${{ steps.cache-key.outputs.value }}

runs:
  using: composite
  steps:
    - name: Build NVD cache key
      id: cache-key
      shell: bash
      env:
        CACHE_OS: ${{ runner.os }}
        DEPENDENCY_DIGEST: ${{ hashFiles('android/gradle/libs.versions.toml') }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        date_utc="$(date -u +%Y-%m-%d)"
        echo "date=$date_utc" >> "$GITHUB_OUTPUT"
        echo "value=nvd-${CACHE_OS}-${DEPENDENCY_DIGEST}-${date_utc}-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    - name: Restore OWASP NVD database
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.gradle/dependency-check-data
        key: ${{ steps.cache-key.outputs.value }}
        restore-keys: |
          nvd-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}-${{ steps.cache-key.outputs.date }}-
          nvd-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}-
          nvd-${{ runner.os }}-
