name: Restore certified Android NVD artifact
description: Restore NVD data only from a successful protected producer run.

inputs:
  github-token:
    description: Token with read access to workflow runs and artifacts.
    required: true
  required:
    description: Fail when no certified producer artifact exists.
    required: false
    default: "false"
  allow-expired:
    description: Allow expired data only as a protected producer refresh seed.
    required: false
    default: "false"

outputs:
  artifact-name:
    description: Exact immutable artifact selected from a successful producer run.
    value: ${{ steps.select.outputs.artifact-name }}
  publication-artifact-name:
    description: Exact immutable artifact name reserved for the current run.
    value: ${{ steps.identity.outputs.artifact-name }}
  producer-run-id:
    description: Successful protected workflow run that published the artifact.
    value: ${{ steps.select.outputs.run-id }}
  producer-generation:
    description: Producer contract generation accepted by this checkout.
    value: ${{ steps.identity.outputs.generation }}
  contract-sha256:
    description: SHA-256 identity of the producer and verifier contract.
    value: ${{ steps.identity.outputs.contract-sha256 }}
  staging-artifact-name:
    description: Isolated immutable artifact used before certification.
    value: ${{ steps.identity.outputs.staging-artifact-name }}
  restored:
    description: Whether a certified producer artifact was restored.
    value: ${{ steps.select.outputs.found }}
  refreshed-at-epoch:
    description: Certified NVD refresh timestamp.
    value: ${{ steps.verify.outputs.refreshed-at-epoch }}
  payload-sha256:
    description: Certified payload tree identity.
    value: ${{ steps.verify.outputs.payload-sha256 }}

runs:
  using: composite
  steps:
    - name: Build NVD publication identity
      id: identity
      shell: bash
      env:
        REPOSITORY_ROOT: ${{ github.workspace }}
        CACHE_OS: ${{ runner.os }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: >-
        python3
        "$REPOSITORY_ROOT/scripts/build_android_nvd_identity.py"

    - name: Select latest certified producer artifact
      id: select
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        NVD_WORKFLOW: android-nvd-cache.yml
        NVD_ARTIFACT_PREFIX: ${{ steps.identity.outputs.artifact-prefix }}
      run: >-
        python3
        "${GITHUB_WORKSPACE}/scripts/select_android_nvd_artifact.py"

    - name: Clear artifact staging paths
      shell: bash
      run: |
        rm -rf \
          "${RUNNER_TEMP}/android-nvd-payload" \
          "${HOME}/.gradle/dependency-check-data"

    - name: Require certified producer artifact
      if: inputs.required == 'true' && steps.select.outputs.found != 'true'
      shell: bash
      run: |
        echo "::error::No certified Android NVD producer artifact is available."
        exit 1

    - name: Download certified producer artifact
      if: steps.select.outputs.found == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ steps.select.outputs.artifact-name }}
        path: ${{ runner.temp }}/android-nvd-payload
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.select.outputs.run-id }}

    - name: Install certified producer artifact
      if: steps.select.outputs.found == 'true'
      shell: bash
      run: |
        set -euo pipefail
        destination="${HOME}/.gradle/dependency-check-data"
        mkdir -p "$(dirname "$destination")"
        mv "${RUNNER_TEMP}/android-nvd-payload" "$destination"

    - name: Verify certified producer artifact
      if: steps.select.outputs.found == 'true'
      id: verify
      shell: bash
      env:
        ALLOW_EXPIRED: ${{ inputs.allow-expired }}
      run: |
        set -euo pipefail
        arguments=(
          verify
          "${HOME}/.gradle/dependency-check-data"
          --github-output "$GITHUB_OUTPUT"
        )
        if [ "$ALLOW_EXPIRED" = "true" ]; then
          arguments+=(--allow-expired)
        elif [ "$ALLOW_EXPIRED" != "false" ]; then
          echo "::error::allow-expired must be true or false."
          exit 1
        fi
        python3 \
          "${GITHUB_WORKSPACE}/android/scripts/dependency_check_nvd_manifest.py" \
          "${arguments[@]}"
