name: Android NVD cache

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-nvd-writer
  queue: max

jobs:
  preflight:
    name: Check Android NVD publication ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject non-default-branch dispatch
        env:
          REQUESTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [ "$REQUESTED_REF" != "$expected_ref" ]; then
            echo "::error::Android NVD publication is restricted to ${expected_ref}."
            exit 1
          fi

  refresh:
    name: Refresh staged Android NVD data
    needs: preflight
    environment: android-nvd-producer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      cache-key: ${{ steps.nvd-cache.outputs.cache-key }}
      staging-cache-key: ${{ steps.nvd-cache.outputs.staging-cache-key }}
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Prepare Android build
        uses: ./.github/actions/prepare-android
        with:
          server-url: ${{ env.TICKETBOX_SERVER_URL }}
          worker-count: "2"

      - name: Restore trusted OWASP NVD database
        id: nvd-cache
        uses: ./.github/actions/restore-android-nvd

      - name: Refresh OWASP NVD database
        env:
          NVD_API_KEY: ${{ secrets.ANDROID_NVD_API_KEY }}
        run: timeout -k 1m 25m bash scripts/refresh_dependency_check_nvd.sh

      - name: Save staged OWASP NVD database
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ steps.nvd-cache.outputs.staging-cache-key }}

  certify:
    name: Certify staged Android NVD data
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Prepare Android build
        uses: ./.github/actions/prepare-android
        with:
          server-url: ${{ env.TICKETBOX_SERVER_URL }}
          worker-count: "2"

      - name: Clear pre-existing OWASP NVD data
        run: rm -rf "${HOME}/.gradle/dependency-check-data"

      - name: Restore staged OWASP NVD database
        id: staged-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ needs.refresh.outputs.staging-cache-key }}
          fail-on-cache-miss: true

      - name: Require the staged cache entry
        env:
          STAGED_CACHE_HIT: ${{ steps.staged-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$STAGED_CACHE_HIT" != "true" ]; then
            echo "::error::The refreshed OWASP NVD payload was not published to staging."
            exit 1
          fi

      - name: Certify staged OWASP NVD payload
        run: bash scripts/certify_dependency_check_nvd_payload.sh

  promote:
    name: Promote certified Android NVD data
    needs:
      - refresh
      - certify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Clear pre-existing OWASP NVD data
        run: rm -rf "${HOME}/.gradle/dependency-check-data"

      - name: Restore certified staged OWASP NVD database
        id: publication-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ needs.refresh.outputs.staging-cache-key }}
          fail-on-cache-miss: true

      - name: Require the certified staged cache entry
        env:
          PUBLICATION_CACHE_HIT: ${{ steps.publication-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$PUBLICATION_CACHE_HIT" != "true" ]; then
            echo "::error::The certified OWASP NVD candidate could not be rehydrated."
            exit 1
          fi

      - name: Verify publication payload identity
        run: >-
          python3 scripts/dependency_check_nvd_manifest.py
          verify "${HOME}/.gradle/dependency-check-data"

      - name: Publish trusted OWASP NVD database
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ needs.refresh.outputs.cache-key }}
