name: Android NVD artifact

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: android-nvd-writer
  queue: max

jobs:
  preflight:
    name: Check Android NVD publication ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Reject non-default-branch dispatch
        env:
          REQUESTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/verify_android_nvd_publication_ref.py

  refresh:
    name: Refresh staged Android NVD data
    needs: preflight
    environment: android-nvd-producer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact-name: ${{ steps.nvd-seed.outputs.publication-artifact-name }}
      contract-sha256: ${{ steps.nvd-seed.outputs.contract-sha256 }}
      staging-cache-key: ${{ steps.nvd-seed.outputs.staging-cache-key }}
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Prepare Android build
        uses: ./.github/actions/prepare-android
        with:
          server-url: ${{ env.TICKETBOX_SERVER_URL }}
          worker-count: "2"

      - name: Restore previous certified NVD artifact
        id: nvd-seed
        uses: ./.github/actions/restore-android-nvd
        with:
          github-token: ${{ github.token }}
          allow-expired: "true"

      - name: Refresh OWASP NVD database
        env:
          NVD_API_KEY: ${{ secrets.ANDROID_NVD_API_KEY }}
        run: timeout -k 1m 25m bash scripts/refresh_dependency_check_nvd.sh

      - name: Save staged OWASP NVD database
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ steps.nvd-seed.outputs.staging-cache-key }}

  certify:
    name: Certify staged Android NVD data
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Prepare Android build
        uses: ./.github/actions/prepare-android
        with:
          server-url: ${{ env.TICKETBOX_SERVER_URL }}
          worker-count: "2"

      - name: Clear pre-existing OWASP NVD data
        run: rm -rf "${HOME}/.gradle/dependency-check-data"

      - name: Restore staged OWASP NVD database
        id: staged-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ needs.refresh.outputs.staging-cache-key }}
          fail-on-cache-miss: true

      - name: Require the staged cache entry
        env:
          STAGED_CACHE_HIT: ${{ steps.staged-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$STAGED_CACHE_HIT" != "true" ]; then
            echo "::error::The refreshed OWASP NVD payload was not published to staging."
            exit 1
          fi

      - name: Certify staged OWASP NVD payload
        run: bash scripts/certify_dependency_check_nvd_payload.sh

  promote:
    name: Publish certified Android NVD artifact
    needs:
      - refresh
      - certify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.publish.outputs.artifact-digest }}
      payload-sha256: ${{ steps.candidate.outputs.payload-sha256 }}
      refreshed-at-epoch: ${{ steps.candidate.outputs.refreshed-at-epoch }}
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Restore previous certified NVD artifact
        id: previous
        uses: ./.github/actions/restore-android-nvd
        with:
          github-token: ${{ github.token }}
          allow-expired: "true"

      - name: Clear pre-existing OWASP NVD data
        run: rm -rf "${HOME}/.gradle/dependency-check-data"

      - name: Restore certified staged OWASP NVD database
        id: publication-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ needs.refresh.outputs.staging-cache-key }}
          fail-on-cache-miss: true

      - name: Require the certified staged cache entry
        env:
          PUBLICATION_CACHE_HIT: ${{ steps.publication-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$PUBLICATION_CACHE_HIT" != "true" ]; then
            echo "::error::The certified OWASP NVD candidate could not be rehydrated."
            exit 1
          fi

      - name: Verify monotonic publication payload
        id: candidate
        env:
          PREVIOUS_REFRESHED_AT_EPOCH: ${{ steps.previous.outputs.refreshed-at-epoch }}
        run: |
          set -euo pipefail
          minimum="${PREVIOUS_REFRESHED_AT_EPOCH:-0}"
          python3 scripts/dependency_check_nvd_manifest.py \
            verify "${HOME}/.gradle/dependency-check-data" \
            --minimum-refreshed-at-epoch "$minimum" \
            --github-output "$GITHUB_OUTPUT"
          echo "NVD_ARTIFACT_PATH=${HOME}/.gradle/dependency-check-data" \
            >> "$GITHUB_ENV"

      - name: Publish immutable certified NVD artifact
        id: publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.refresh.outputs.artifact-name }}
          path: ${{ env.NVD_ARTIFACT_PATH }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  verify-publication:
    name: Verify published Android NVD artifact
    needs:
      - refresh
      - promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download exact published NVD artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.refresh.outputs.artifact-name }}
          path: ${{ runner.temp }}/android-nvd-published

      - name: Verify exact published payload
        env:
          EXPECTED_PAYLOAD_SHA256: ${{ needs.promote.outputs.payload-sha256 }}
        run: >-
          python3 android/scripts/dependency_check_nvd_manifest.py
          verify "${RUNNER_TEMP}/android-nvd-published"
          --expected-payload-sha256 "$EXPECTED_PAYLOAD_SHA256"
