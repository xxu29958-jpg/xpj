name: Android Connected Test

# Path-filtered emulator gate for Compose UI contract tests
# (connectedGrayDebugAndroidTest). Restored from the pre-Gitea original; the
# codex "android-connected-cloud" rewrite dropped the Enable KVM step
# (without hardware accel the emulator boot is glacial / times out) and the
# failure-report artifact upload. Triggered only when Android sources change
# so backend / docs / config PRs don't pay the emulator boot cost.

on:
  push:
    # Work branches are validated by pull_request path filters below. Keeping
    # push emulator runs to main avoids duplicate PR-head emulator boots.
    branches:
      - main
    paths:
      - "android/app/src/**"
      - "android/gradle/**"
      - "android/app/build.gradle.kts"
      - "android/build.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradlew.bat"
      - "android/settings.gradle.kts"
      - ".github/workflows/android-connected-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/app/src/**"
      - "android/gradle/**"
      - "android/app/build.gradle.kts"
      - "android/build.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradlew.bat"
      - "android/settings.gradle.kts"
      - ".github/workflows/android-connected-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-connected-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: Connected (emulator)
    runs-on: ubuntu-latest
    # The connected action has the 20-minute qualification ceiling. The wider
    # job cap covers setup plus post-action verification and diagnostic upload;
    # it is an infrastructure envelope, not a relaxed qualification target.
    timeout-minutes: 30

    env:
      # Same canonical owner URL the regular android job injects, so
      # BuildConfig.DEFAULT_SERVER_URL is populated. From the repo Actions variable
      # (keeps the origin host out of the public workflow file).
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM
        # ubuntu runners gate /dev/kvm behind a udev rule; without this the
        # x86_64 emulator falls back to no hardware accel and the boot times out.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected test
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          working-directory: android
          script: |
            set -uo pipefail
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "ticketbox.serverUrl=$TICKETBOX_SERVER_URL" >> local.properties
            capture_connected_failure() {
              connected_status=$?
              trap - EXIT
              if [ "$connected_status" -ne 0 ]; then
                echo "Connected Gradle invocation failed with status $connected_status." >&2
                # The 18-minute in-action watchdog leaves time to preserve
                # diagnostics before the 20-minute action ceiling kills the
                # host process. Ordinary task failures are already captured
                # by the Gradle finalizer; repeating capture is harmless.
                ./gradlew --no-daemon :app:captureGrayConnectedTestCrashLog || true
              fi
              exit "$connected_status"
            }
            trap capture_connected_failure EXIT
            timeout --signal=INT --kill-after=30s 18m \
              ./gradlew --no-daemon :app:connectedGrayDebugAndroidTest

      - name: Verify connected process health
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          crash_log="$RUNNER_TEMP/ticketbox-connected-crash.log"
          if [ ! -f "$crash_log" ] || [ ! -r "$crash_log" ]; then
            echo "Connected crash evidence is missing or unreadable: $crash_log" >&2
            exit 1
          fi

          apk_from_output() {
            output_dir=$1
            mapfile -d '' -t apk_files < <(find "$output_dir" -type f -name '*.apk' -print0)
            if [ "${#apk_files[@]}" -ne 1 ]; then
              echo "Expected exactly one APK under $output_dir; found ${#apk_files[@]}." >&2
              return 1
            fi
            printf '%s\n' "${apk_files[0]}"
          }

          application_processes_from_apk() {
            apk_file=$1
            application_id="$(
              "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
                manifest application-id "$apk_file"
            )"
            manifest_file="$(mktemp)"
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
              manifest print "$apk_file" > "$manifest_file"
            python3 - "$application_id" "$manifest_file" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          application_id, manifest_path = sys.argv[1:]
          android_process = "{http://schemas.android.com/apk/res/android}process"
          processes = {application_id}
          for element in ET.parse(manifest_path).getroot().iter():
              raw = element.attrib.get(android_process)
              if not raw:
                  continue
              if raw.startswith(":") or raw.startswith("."):
                  processes.add(application_id + raw)
              else:
                  processes.add(raw)
          for process_name in sorted(processes):
              print(process_name)
          PY
            process_status=$?
            rm -f "$manifest_file"
            return "$process_status"
          }

          process_crashed() {
            expected_process=$1
            awk -v expected="$expected_process" '
              {
                marker = "Process: "
                marker_position = index($0, marker)
                if (marker_position > 0) {
                  process_name = substr($0, marker_position + length(marker))
                  sub(/,.*/, "", process_name)
                  if (process_name == expected) {
                    found = 1
                  }
                }
              }
              END { exit found ? 0 : 1 }
            ' "$crash_log"
          }

          declare -A expected_processes=()
          for output_dir in \
            app/build/outputs/apk/gray/debug \
            app/build/outputs/apk/androidTest/gray/debug
          do
            apk_file="$(apk_from_output "$output_dir")"
            process_list="$(application_processes_from_apk "$apk_file")"
            while IFS= read -r process_name; do
              if [ -n "$process_name" ]; then
                expected_processes["$process_name"]=1
              fi
            done <<< "$process_list"
          done
          if [ "${#expected_processes[@]}" -eq 0 ]; then
            echo "No connected-test process identities were derived from the APKs." >&2
            exit 1
          fi

          for process_name in "${!expected_processes[@]}"; do
            if process_crashed "$process_name"; then
              echo "Connected tests left a crashed process for $process_name." >&2
              cat "$crash_log"
              exit 1
            else
              crash_scan_status=$?
              if [ "$crash_scan_status" -ne 1 ]; then
                echo "Could not audit connected crash evidence for $process_name." >&2
                exit "$crash_scan_status"
              fi
            fi
          done

      - name: Upload androidTest reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connected-test-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/ticketbox-connected-crash.log
          if-no-files-found: ignore
          retention-days: 7
