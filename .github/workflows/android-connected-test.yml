name: Android Connected Test

# Scope-aware emulator gate for Compose UI contract tests
# (connectedGrayDebugAndroidTest). Restored from the pre-Gitea original; the
# codex "android-connected-cloud" rewrite dropped the Enable KVM step
# (without hardware accel the emulator boot is glacial / times out) and the
# failure-report artifact upload. The shared fail-closed scope resolver keeps
# unrelated PRs cheap without GitHub's path-filter file-count blind spot.

on:
  push:
    # Work branches are validated by pull_request below. Keeping push runs to
    # main avoids validating the same PR head twice.
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types:
      - qualification

permissions:
  contents: read

concurrency:
  group: android-connected-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Connected scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
      android_connected: ${{ steps.scope.outputs.android_connected }}
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Resolve Android scope
        id: scope
        shell: bash
        run: |
          python -E -S backend/scripts/ci_scope.py \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || '' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$GITHUB_OUTPUT"

  connected_execution:
    name: Connected execution (${{ matrix.shard.label }})
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.android_connected != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - index: 0
            count: 3
            label: 1/3
          - index: 1
            count: 3
            label: 2/3
          - index: 2
            count: 3
            label: 3/3
    # First-round measured budget: precompile, 24m test task, 30m Gradle
    # command, bounded after/crash finalizer, then diagnostic upload.
    timeout-minutes: 45
    # Shared checkout identity only; full matrix coverage is verified below
    # from every shard's evidence, never from the last matrix output.
    outputs:
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}

    env:
      # Same canonical owner URL the regular android job injects, so
      # BuildConfig.DEFAULT_SERVER_URL is populated. From the repo Actions variable
      # (keeps the origin host out of the public workflow file).
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}
      TICKETBOX_CONNECTED_CHECKOUT_SHA: ${{ github.sha }}
      TICKETBOX_CONNECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TICKETBOX_CONNECTED_RUN_ID: ${{ github.run_id }}
      TICKETBOX_CONNECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
      TICKETBOX_CONNECTED_SHARD_INDEX: ${{ matrix.shard.index }}
      TICKETBOX_CONNECTED_SHARD_COUNT: ${{ matrix.shard.count }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version-file: android/.java-version
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Precompile connected APKs
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleGrayDebug :app:assembleGrayDebugAndroidTest

      - name: Enable KVM
        # ubuntu runners gate /dev/kvm behind a udev rule; without this the
        # x86_64 emulator falls back to no hardware accel and the boot times out.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected test
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          working-directory: android
          # The action executes each input line in a fresh `sh -c`; keep this
          # as one direct command whose exit status is the Gradle exit status.
          # The 24m test task owns the suite. The bounded after/crash
          # finalizer still runs inside this command after task failure or
          # timeout, while the emulator is up. Do not move it after this step.
          script: timeout --signal=INT --kill-after=30s 30m ./gradlew --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true "-Pandroid.testInstrumentationRunnerArguments.numShards=${{ matrix.shard.count }}" "-Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard.index }}" :app:connectedGrayDebugAndroidTest

      - name: Upload real consumer art previews
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumer-art-previews-${{ matrix.shard.index }}-attempt-${{ github.run_attempt }}
          path: android/app/build/**/ticketbox-art-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload connected shard evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connected-shard-${{ matrix.shard.index }}-attempt-${{ github.run_attempt }}
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/ticketbox-connected-crash.log
            ${{ runner.temp }}/ticketbox-connected-exit-info-before.txt
            ${{ runner.temp }}/ticketbox-connected-exit-info-after.txt
            ${{ runner.temp }}/ticketbox-connected-discovery.txt
            ${{ runner.temp }}/ticketbox-connected-discovery-exit-code.txt
            ${{ runner.temp }}/ticketbox-connected-shard-evidence.json
          if-no-files-found: error
          retention-days: 7

  connected:
    name: Connected (emulator)
    needs:
      - scope
      - connected_execution
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Require all connected shards
        if: ${{ success() && needs.scope.outputs.android_connected != 'false' }}
        env:
          EXECUTION_RESULT: ${{ needs.connected_execution.result }}
        run: test "$EXECUTION_RESULT" = success

      - name: Download connected shard evidence
        if: ${{ success() && needs.scope.outputs.android_connected != 'false' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: connected-shard-*
          path: connected-shards
          merge-multiple: false

      - name: Qualify connected shard union
        if: ${{ success() && needs.scope.outputs.android_connected != 'false' }}
        env:
          EXPECTED_SHARD_COUNT: "3"
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python -E -S android/scripts/verify_android_test_qualification.py connected-shards
          --evidence-root connected-shards
          --baseline android/audit/test_count_baseline.txt
          --expected-shard-count "$EXPECTED_SHARD_COUNT"
          --expected-checkout-sha "$EXPECTED_CHECKOUT_SHA"
          --expected-source-sha "$EXPECTED_SOURCE_SHA"
          --expected-run-id "$EXPECTED_RUN_ID"
          --expected-run-attempt "$EXPECTED_RUN_ATTEMPT"

      - name: Enforce Connected result
        env:
          BASH_ENV: ""
          ENV: ""
          SCOPE_RESULT: ${{ needs.scope.result }}
          ANDROID_SCOPE: ${{ needs.scope.outputs.android }}
          ANDROID_CONNECTED_SCOPE: ${{ needs.scope.outputs.android_connected }}
          EXECUTION_RESULT: ${{ needs.connected_execution.result }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCOPE_SHA: ${{ needs.scope.outputs.qualification_sha }}
          SCOPE_SOURCE_SHA: ${{ needs.scope.outputs.qualification_source_sha }}
          EXECUTION_SHA: ${{ needs.connected_execution.outputs.qualification_sha }}
          EXECUTION_SOURCE_SHA: ${{ needs.connected_execution.outputs.qualification_source_sha }}
          AGGREGATOR_SHA: ${{ steps.qualification.outputs.sha }}
          AGGREGATOR_SOURCE_SHA: ${{ steps.qualification.outputs.source_sha }}
        run: python -E -S backend/scripts/verify_scoped_ci_results.py --label Connected --scope-key ANDROID_SCOPE --lane EXECUTION --lane-scope EXECUTION=ANDROID_CONNECTED_SCOPE
