name: Android Connected Test

# Scope-aware emulator gate for Compose UI contract tests
# (connectedGrayDebugAndroidTest). Restored from the pre-Gitea original; the
# codex "android-connected-cloud" rewrite dropped the Enable KVM step
# (without hardware accel the emulator boot is glacial / times out) and the
# failure-report artifact upload. The shared fail-closed scope resolver keeps
# unrelated PRs cheap without GitHub's path-filter file-count blind spot.

on:
  push:
    # Work branches are validated by pull_request below. Keeping push runs to
    # main avoids validating the same PR head twice.
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types:
      - qualification

permissions:
  contents: read

concurrency:
  group: android-connected-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Connected scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Resolve Android scope
        id: scope
        shell: bash
        run: |
          python -E -S backend/scripts/ci_scope.py \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || '' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$GITHUB_OUTPUT"

      - name: Write run identity
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          XPJ_TIMING_WORKFLOW: Android Connected Test
          XPJ_WEIGHT_EVENT: ${{ github.event_name }}
          XPJ_WEIGHT_SOURCE_SHA: ${{ steps.qualification.outputs.source_sha }}
          XPJ_WEIGHT_MEASUREMENT_SHA: ${{ steps.qualification.outputs.sha }}
          XPJ_WEIGHT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: >-
          python -E -S backend/scripts/ci_run_timing.py
          --write-identity-json ${{ runner.temp }}/ci-run-identity.json
          --attempt "${{ github.run_attempt }}"

      - name: Upload run identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-run-identity
          path: ${{ runner.temp }}/ci-run-identity.json
          if-no-files-found: error
          retention-days: 30

  connected_execution:
    name: Connected execution
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.android != 'false') }}
    runs-on: ubuntu-latest
    # First-round measured budget: precompile, 24m test task, 30m Gradle
    # command, bounded after/crash finalizer, then diagnostic upload.
    timeout-minutes: 45
    outputs:
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}

    env:
      # Same canonical owner URL the regular android job injects, so
      # BuildConfig.DEFAULT_SERVER_URL is populated. From the repo Actions variable
      # (keeps the origin host out of the public workflow file).
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version-file: android/.java-version
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Precompile connected APKs
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleGrayDebug :app:assembleGrayDebugAndroidTest

      - name: Enable KVM
        # ubuntu runners gate /dev/kvm behind a udev rule; without this the
        # x86_64 emulator falls back to no hardware accel and the boot times out.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start inner connected command timing
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          XPJ_TIMING_WORKFLOW: Android Connected Test
          XPJ_WEIGHT_EVENT: ${{ github.event_name }}
          XPJ_WEIGHT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          XPJ_WEIGHT_MEASUREMENT_SHA: ${{ github.sha }}
        run: >-
          python -E -S backend/scripts/ci_run_timing.py
          --stamp-connected-inner ${{ runner.temp }}/connected-inner-timing.json
          --attempt "${{ github.run_attempt }}"
          --inner-state started
          --inner-reason "inner Gradle timing not finalized"
          --allow-partial
          --job-name "Connected execution"
          --outer-step "Run connected test"

      - name: Run connected test
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          working-directory: android
          # The action executes each input line in a fresh `sh -c`; keep this
          # as one direct command whose exit status is the Gradle exit status.
          # The 24m test task owns the suite. The bounded after/crash
          # finalizer still runs inside this command after task failure or
          # timeout, while the emulator is up. Do not move it after this step.
          script: timeout --signal=INT --kill-after=30s 30m ./gradlew --no-daemon --max-workers=2 -I ci-connected-inner-timing.init.gradle -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedGrayDebugAndroidTest

      - name: Stamp inner connected command timing
        if: ${{ always() }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          XPJ_TIMING_WORKFLOW: Android Connected Test
          XPJ_WEIGHT_EVENT: ${{ github.event_name }}
          XPJ_WEIGHT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          XPJ_WEIGHT_MEASUREMENT_SHA: ${{ github.sha }}
        run: >-
          python -E -S backend/scripts/ci_run_timing.py
          --stamp-connected-inner ${{ runner.temp }}/connected-inner-timing.json
          --attempt "${{ github.run_attempt }}"
          --job-name "Connected execution"
          --outer-step "Run connected test"

      - name: Upload inner connected command timing
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connected-inner-timing
          path: ${{ runner.temp }}/connected-inner-timing.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload real consumer art previews
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumer-art-previews
          path: android/app/build/**/ticketbox-art-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload androidTest reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connected-test-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/ticketbox-connected-crash.log
            ${{ runner.temp }}/ticketbox-connected-exit-info-before.txt
            ${{ runner.temp }}/ticketbox-connected-exit-info-after.txt
          if-no-files-found: ignore
          retention-days: 7

  connected:
    name: Connected (emulator)
    needs:
      - scope
      - connected_execution
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Enforce Connected result
        env:
          BASH_ENV: ""
          ENV: ""
          SCOPE_RESULT: ${{ needs.scope.result }}
          ANDROID_SCOPE: ${{ needs.scope.outputs.android }}
          EXECUTION_RESULT: ${{ needs.connected_execution.result }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCOPE_SHA: ${{ needs.scope.outputs.qualification_sha }}
          SCOPE_SOURCE_SHA: ${{ needs.scope.outputs.qualification_source_sha }}
          EXECUTION_SHA: ${{ needs.connected_execution.outputs.qualification_sha }}
          EXECUTION_SOURCE_SHA: ${{ needs.connected_execution.outputs.qualification_source_sha }}
          AGGREGATOR_SHA: ${{ steps.qualification.outputs.sha }}
          AGGREGATOR_SOURCE_SHA: ${{ steps.qualification.outputs.source_sha }}
        run: python -E -S backend/scripts/verify_scoped_ci_results.py --label Connected --scope-key ANDROID_SCOPE --lane EXECUTION
