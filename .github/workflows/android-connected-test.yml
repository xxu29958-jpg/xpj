name: Android Connected Test

# Path-filtered emulator gate for Compose UI contract tests
# (connectedGrayDebugAndroidTest). Restored from the pre-Gitea original; the
# codex "android-connected-cloud" rewrite dropped the Enable KVM step
# (without hardware accel the emulator boot is glacial / times out) and the
# failure-report artifact upload. Triggered only when Android sources change
# so backend / docs / config PRs don't pay the emulator boot cost.

on:
  push:
    # Work branches are validated by pull_request path filters below. Keeping
    # push emulator runs to main avoids duplicate PR-head emulator boots.
    branches:
      - main
    paths:
      - "android/app/src/**"
      - "android/gradle/**"
      - "android/app/build.gradle.kts"
      - "android/build.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradlew.bat"
      - "android/settings.gradle.kts"
      - "android/audit/test_count_baseline.txt"
      - "android/scripts/**"
      - ".github/workflows/android-connected-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/app/src/**"
      - "android/gradle/**"
      - "android/app/build.gradle.kts"
      - "android/build.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradlew.bat"
      - "android/settings.gradle.kts"
      - "android/audit/test_count_baseline.txt"
      - "android/scripts/**"
      - ".github/workflows/android-connected-test.yml"
  repository_dispatch:
    types:
      - qualification

permissions:
  contents: read

concurrency:
  group: android-connected-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: Connected (emulator)
    runs-on: ubuntu-latest
    # The connected action has the 20-minute qualification ceiling. The wider
    # job cap covers setup plus post-action verification and diagnostic upload;
    # it is an infrastructure envelope, not a relaxed qualification target.
    timeout-minutes: 30

    env:
      # Same canonical owner URL the regular android job injects, so
      # BuildConfig.DEFAULT_SERVER_URL is populated. From the repo Actions variable
      # (keeps the origin host out of the public workflow file).
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM
        # ubuntu runners gate /dev/kvm behind a udev rule; without this the
        # x86_64 emulator falls back to no hardware accel and the boot times out.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected test
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          working-directory: android
          # The action executes each input line in a fresh `sh -c`; keep this
          # as one direct command whose exit status is the Gradle exit status.
          # The Gradle task owns test execution, result-count qualification and
          # process-exit verification before the emulator action tears down.
          script: timeout --signal=INT --kill-after=30s 14m ./gradlew --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedGrayDebugAndroidTest

      - name: Upload androidTest reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connected-test-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/ticketbox-connected-crash.log
            ${{ runner.temp }}/ticketbox-connected-exit-info-before.txt
            ${{ runner.temp }}/ticketbox-connected-exit-info-after.txt
          if-no-files-found: ignore
          retention-days: 7
