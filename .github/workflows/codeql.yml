name: CodeQL

# GitHub-native SAST. Restored from the pre-Gitea original (deleted in d92c926d,
# NOT brought back by the codex "cloud-ci" rewrite). This is the one capability
# the local-Gitea CI structurally cannot provide: results land in the repo's
# Security tab. Scans four scripted languages plus the Android Kotlin app.

on:
  push:
    # Work branches are scanned by pull_request or explicit workflow_dispatch.
    # The weekly schedule scans the default branch.
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-scripted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-android:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # From the repo Actions variable (keeps the origin host out of the public workflow file).
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Prepare Android build
        uses: ./.github/actions/prepare-android
        with:
          server-url: ${{ env.TICKETBOX_SERVER_URL }}
          worker-count: "2"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          languages: java-kotlin
          # Kotlin requires a real build. The overlay cache only supports
          # build-mode none, which would omit Kotlin analysis.
          build-mode: manual

      - name: Build Android for CodeQL
        working-directory: android
        # Manual mode analyzes the sources built by this command. Compiling both
        # shipped variants covers their Kotlin source sets without spending heap
        # and time on D8/APK packaging, which is qualified in the Android CI job.
        run: ./gradlew --no-daemon --no-build-cache --max-workers=2 :app:compileGrayDebugKotlin :app:compileInternalDebugKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          category: "/language:java-kotlin"
