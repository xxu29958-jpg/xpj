name: CodeQL

# GitHub-native SAST. Restored from the pre-Gitea original (deleted in d92c926d,
# NOT brought back by the codex "cloud-ci" rewrite). This is the one capability
# the local-Gitea CI structurally cannot provide: results land in the repo's
# Security tab. Scans four scripted languages plus the Android Kotlin app.

on:
  push:
    # Work branches are scanned by pull_request. Manual qualification is
    # default-branch-only through repository_dispatch.
    # The weekly schedule scans the default branch.
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types:
      - qualification
  schedule:
    - cron: "37 3 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CodeQL scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Resolve Android scope
        id: scope
        shell: bash
        run: |
          python -E -S backend/scripts/ci_scope.py \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || '' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$GITHUB_OUTPUT"

  analyze-scripted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-android:
    name: Analyze (java-kotlin)
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.android != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # From the repo Actions variable (keeps the origin host out of the public workflow file).
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version-file: android/.java-version
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Point Gradle at cloud Android SDK
        working-directory: android
        run: |
          sdk_dir="${ANDROID_HOME//\\/\\\\}"
          echo "sdk.dir=$sdk_dir" > local.properties
          echo "ticketbox.serverUrl=$TICKETBOX_SERVER_URL" >> local.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Android for CodeQL
        working-directory: android
        # CodeQL observes compiler invocations. Keep dependency/wrapper caches,
        # but force these compile-only tasks to execute instead of restoring
        # compiler outputs from Gradle's build cache.
        run: ./gradlew --no-daemon --no-build-cache --max-workers=2 :app:compileGrayDebugKotlin :app:compileGrayDebugJavaWithJavac :app:compileInternalDebugKotlin :app:compileInternalDebugJavaWithJavac

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          category: "/language:java-kotlin"

      - name: Enforce CodeQL scope result
        if: ${{ always() && !cancelled() }}
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          ANDROID_SCOPE: ${{ needs.scope.outputs.android }}
          SCOPE_SHA: ${{ needs.scope.outputs.qualification_sha }}
          SCOPE_SOURCE_SHA: ${{ needs.scope.outputs.qualification_source_sha }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AGGREGATOR_SHA: ${{ steps.qualification.outputs.sha }}
          AGGREGATOR_SOURCE_SHA: ${{ steps.qualification.outputs.source_sha }}
        run: python -E -S backend/scripts/verify_scoped_ci_results.py --label CodeQL --scope-key ANDROID_SCOPE
