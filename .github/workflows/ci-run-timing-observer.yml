name: CI run timing observer

# Read-only post-run collector. workflow_run fires for success, failure, and
# cancelled. This is the cancelled-waste path that the in-run timing job cannot
# take because it is skipped with !cancelled(). It does not change required
# checks, product gates, or classifier behavior.

on:
  workflow_run:
    workflows:
      - CI
      - Android Connected Test
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  observe:
    name: Observe completed run timing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Record observed run timing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XPJ_TIMING_WORKFLOW: ${{ github.event.workflow_run.name }}
          XPJ_WEIGHT_EVENT: ${{ github.event.workflow_run.event }}
          XPJ_WEIGHT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          XPJ_TIMING_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: >-
          python -E -S backend/scripts/ci_run_timing.py
          --from-github
          --from-run-identity
          --github-repository "${{ github.repository }}"
          --github-run-id "${{ github.event.workflow_run.id }}"
          --attempt "${{ github.event.workflow_run.run_attempt }}"
          --run-conclusion "${{ github.event.workflow_run.conclusion }}"
          --output-json ${{ runner.temp }}/ci-run-timing.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Record cancelled Connected inner timing
        if: >-
          ${{ always()
              && github.event.workflow_run.name == 'Android Connected Test'
              && github.event.workflow_run.conclusion == 'cancelled' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XPJ_TIMING_WORKFLOW: ${{ github.event.workflow_run.name }}
          XPJ_WEIGHT_EVENT: ${{ github.event.workflow_run.event }}
          XPJ_WEIGHT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python -E -S backend/scripts/ci_run_timing.py
          --stamp-connected-inner ${{ runner.temp }}/connected-inner-timing.json
          --from-github
          --from-run-identity
          --github-repository "${{ github.repository }}"
          --github-run-id "${{ github.event.workflow_run.id }}"
          --attempt "${{ github.event.workflow_run.run_attempt }}"
          --allow-partial
          --derive-cancelled-inner
          --job-name "Connected execution"
          --outer-step "Run connected test"

      - name: Upload observed run timing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-run-timing-observer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/ci-run-timing.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload cancelled Connected inner timing
        if: ${{ always() && github.event.workflow_run.name == 'Android Connected Test' && github.event.workflow_run.conclusion == 'cancelled' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connected-inner-timing-observer-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/connected-inner-timing.json
          if-no-files-found: error
          retention-days: 30
