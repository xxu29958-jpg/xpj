name: CI

# GitHub cloud CI — restored from the pre-Gitea original (deleted in d92c926d
# during the local-Gitea cut-over) and upgraded to the current PG-only codebase.
# This is the authoritative cloud merge gate. Gitea remains a fallback mirror;
# each provider validates its own workflow contract, while local audits can
# still validate both together. The original lived
# as ci.yml; the codex "cloud-ci.yml" rewrite dropped CodeQL, emulator KVM,
# fetch-depth:0 and concurrency — all restored here.

on:
  push:
    # Work branches are validated by the pull_request trigger below. Keeping
    # push heavy CI to main avoids running the same PR head twice.
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      adr_base_ref:
        description: Canonical default-branch divergence commit for ADR history ratchets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      postgres: ${{ steps.scope.outputs.postgres }}
      backend_frozen: ${{ steps.scope.outputs.backend_frozen }}
      desktop: ${{ steps.scope.outputs.desktop }}
      android: ${{ steps.scope.outputs.android }}
      windows: ${{ steps.scope.outputs.windows }}
      postgres_matrix: ${{ steps.scope.outputs.postgres_matrix }}
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Resolve heavy-job scope
        id: scope
        shell: bash
        run: |
          python -E -S backend/scripts/ci_scope.py \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || '' }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$GITHUB_OUTPUT"

  backend_contracts:
    name: Backend contracts
    runs-on: windows-latest
    timeout-minutes: 12
    outputs:
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # ADR-0038 PR-Δ gate needs ``git show <base_ref>:...`` to read the
          # base baseline; shallow clone can't reach it and the gate FAILs in
          # PR CI rather than silently downgrading to strict-equality-only.
          fetch-depth: 0

      - name: Check PowerShell scripts
        working-directory: .
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\check_text_encoding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts\check_dependency_versions.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $roots = @("backend/scripts", "backend/packaging", "desktop/scripts", "android/scripts", "scripts") | Where-Object { Test-Path $_ }
          $files = Get-ChildItem -Path $roots -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if (-not $hasBom) {
              throw "$($file.FullName) must be UTF-8 with BOM for Windows PowerShell 5.1"
            }
            $errors = $null
            [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw -Encoding UTF8 -LiteralPath $file.FullName), [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$($file.FullName) syntax error: $($errors[0].Message)"
            }
            Write-Host "OK $($file.FullName)"
          }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Verify qualification SHA
        id: qualification
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall app scripts tests packaging/tests

      - name: Lint
        run: ruff check app scripts tests packaging/tests

      - name: CI orchestration contracts
        run: python scripts/run_ci_contract_tests.py

      - name: Audit (release lanes)
        # Single PR gate for every read-only audit (release_audit.py::LANES):
        # service-graph cycles, CI-gap whitelist, codebase smell report, etc.
        # Any lane returning non-zero fails the PR.
        env:
          XPJ_RELEASE_AUDIT_COMPACT: "1"
          XPJ_CI_AUDIT_PROVIDER: github
          XPJ_AUDIT_DEFAULT_REF: refs/remotes/origin/main
          # PRs compare with the exact target SHA; main pushes compare with the
          # pre-push SHA; manual runs must name the canonical divergence commit.
          XPJ_AUDIT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.adr_base_ref }}
        run: python scripts\release_audit.py

      - name: API contract
        run: python scripts\check_api_contract.py

      # NOTE: the business pytest suite AND the end-to-end smoke run on PostgreSQL in the
      # backend-postgres job below. SQLite (the old dev dialect) was retired in
      # the PG-only migration, so neither a bare pytest nor the threaded smoke
      # server can run here — this Windows job is static checks only.

      - name: Dependency vulnerability scan (pip-audit)
        # Fail the PR on any known-vulnerable Python dependency. ``--strict``
        # also fails on warnings (yanked package, etc.); ``--vulnerability-service
        # osv`` uses the public OSV database (no auth).
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict --vulnerability-service osv -r requirements.txt -r requirements-dev.txt -r ../desktop/requirements.txt

  backend_frozen:
    name: Frozen backend smoke
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.backend_frozen != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 12
    outputs:
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    defaults:
      run:
        working-directory: backend
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Cache pinned frozen-backend toolchain archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/build/windows-toolchain/archives
          key: windows-backend-toolchain-${{ hashFiles('backend/packaging/windows-build-toolchain.json', 'backend/requirements-build.lock', 'backend/packaging/prepare_windows_build_toolchain.ps1') }}

      - name: Frozen backend locked smoke build
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\build_backend_exe.ps1 -Clean

  windows_packaging:
    name: Windows release packaging
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.windows != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            desktop/requirements.txt

      - name: Verify qualification SHA
        id: qualification
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Windows installer safety behavior
        run: python -m pytest -q packaging/tests -p no:cacheprovider

      - name: Windows database maintenance contract
        run: >-
          python -m pytest -q
          tests/test_windows_task_status.py::test_db_maintenance_scripts_resolve_configured_database_url
          --noconftest --strict-markers -p no:cacheprovider -o addopts=

      - name: Installer source preflight (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -CheckSourceInputsOnly

      - name: Installer source preflight (PowerShell 7)
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -CheckSourceInputsOnly

      - name: Cache pinned Windows build inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            backend/build/windows-toolchain/archives
            backend/packaging/vendor/archives
            backend/packaging/vendor/pg
            backend/packaging/vendor/shawl
          key: windows-installer-vendor-${{ hashFiles('backend/packaging/windows-build-toolchain.json', 'backend/packaging/build_pg_bundle.ps1', 'backend/packaging/prepare_windows_installer_vendor.ps1') }}

      - name: Frozen backend locked release build
        shell: powershell
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\build_backend_exe.ps1 -Clean

      - name: Frozen Desktop Manager locked release build
        shell: powershell
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\desktop\scripts\build_manager_exe.ps1 -Clean

      - name: Prepare pinned PostgreSQL and Shawl inputs
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\prepare_windows_installer_vendor.ps1 -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare pinned Inno Setup compiler
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\prepare_windows_build_toolchain.ps1 -Component Inno -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile authoritative Inno installer
        id: compile_installer
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -InstallerHashOutputFile "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify atomic Windows installer publish unit
        shell: powershell
        env:
          INSTALLER_EXPECTED_SHA256: ${{ steps.compile_installer.outputs.installer_sha256 }}
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -VerifyOnly -ExpectedInstallerSha256 "$env:INSTALLER_EXPECTED_SHA256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve verified Windows installer publish path
        shell: powershell
        run: |
          $versionText = Get-Content -LiteralPath app\version.py -Raw -Encoding UTF8
          $versionMatch = [regex]::Match($versionText, '(?m)^\s*BACKEND_VERSION\s*=\s*"([^"]+)"\s*$')
          if (-not $versionMatch.Success) { throw "Cannot resolve installer publish version." }
          $publishPath = "dist/installer/Ticketbox-Setup-$($versionMatch.Groups[1].Value)"
          if (-not (Test-Path -LiteralPath $publishPath -PathType Container)) {
            throw "Verified installer publish path is missing: $publishPath"
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "INSTALLER_PUBLISH_PATH=backend/$publishPath" + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Upload atomic Windows installer publish unit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ticketbox-windows-installer
          path: ${{ env.INSTALLER_PUBLISH_PATH }}
          if-no-files-found: error

      - name: Create fresh installer verification directory
        shell: powershell
        run: |
          $downloadRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $downloadPath = Join-Path $downloadRoot ("ticketbox-installer-verify-" + [Guid]::NewGuid().ToString("N"))
          if (Test-Path -LiteralPath $downloadPath) { throw "Installer verification directory already exists." }
          New-Item -ItemType Directory -Path $downloadPath -ErrorAction Stop | Out-Null
          if (@([System.IO.Directory]::EnumerateFileSystemEntries($downloadPath)).Count -ne 0) {
            throw "Installer verification directory is not empty."
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "INSTALLER_VERIFY_DOWNLOAD_PATH=$downloadPath" + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Download uploaded Windows installer publish unit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ticketbox-windows-installer
          path: ${{ env.INSTALLER_VERIFY_DOWNLOAD_PATH }}

      - name: Verify uploaded Windows installer bytes
        shell: powershell
        env:
          INSTALLER_EXPECTED_SHA256: ${{ steps.compile_installer.outputs.installer_sha256 }}
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -VerifyOnly -ExpectedInstallerSha256 "$env:INSTALLER_EXPECTED_SHA256" -VerifyPublishDirectory "$env:INSTALLER_VERIFY_DOWNLOAD_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  backend:
    name: Backend
    needs:
      - scope
      - backend_contracts
      - backend_frozen
      - windows_packaging
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Enforce required CI results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BACKEND_FROZEN_SCOPE: ${{ needs.scope.outputs.backend_frozen }}
          WINDOWS_SCOPE: ${{ needs.scope.outputs.windows }}
          BACKEND_CONTRACTS_RESULT: ${{ needs.backend_contracts.result }}
          BACKEND_FROZEN_RESULT: ${{ needs.backend_frozen.result }}
          WINDOWS_PACKAGING_RESULT: ${{ needs.windows_packaging.result }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AGGREGATOR_SHA: ${{ steps.qualification.outputs.sha }}
          AGGREGATOR_SOURCE_SHA: ${{ steps.qualification.outputs.source_sha }}
          SCOPE_SHA: ${{ needs.scope.outputs.qualification_sha }}
          SCOPE_SOURCE_SHA: ${{ needs.scope.outputs.qualification_source_sha }}
          BACKEND_CONTRACTS_SHA: ${{ needs.backend_contracts.outputs.qualification_sha }}
          BACKEND_CONTRACTS_SOURCE_SHA: ${{ needs.backend_contracts.outputs.qualification_source_sha }}
          BACKEND_FROZEN_SHA: ${{ needs.backend_frozen.outputs.qualification_sha }}
          BACKEND_FROZEN_SOURCE_SHA: ${{ needs.backend_frozen.outputs.qualification_source_sha }}
          WINDOWS_PACKAGING_SHA: ${{ needs.windows_packaging.outputs.qualification_sha }}
          WINDOWS_PACKAGING_SOURCE_SHA: ${{ needs.windows_packaging.outputs.qualification_source_sha }}
        run: python -E -S backend/scripts/verify_backend_ci_results.py

  backend_postgres_ordinary:
    name: Backend PostgreSQL / ordinary
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.postgres != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy: &postgres_test_strategy
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.postgres_matrix) }}
    outputs:
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    services:
      postgres: &postgres_test_service
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_PASSWORD: &postgres_test_password xpj-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432/tcp
        # CI speed-up: data dir on tmpfs (RAM). The PG suite is I/O-bound
        # (hundreds of MB of checkpoints/WAL under fsync); a RAM-backed data
        # dir makes those ~free. Safe — this DB is ephemeral per run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - &postgres_setup_python
        name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - &postgres_qualification
        name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - &postgres_load_contract
        name: Load test PostgreSQL contract
        env:
          TEST_POSTGRES_PASSWORD: *postgres_test_password
          TEST_POSTGRES_APPLICATION_PASSWORD: xpj-app-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -E -S -m scripts.write_test_postgres_env --host localhost --port "${{ job.services.postgres.ports[5432] }}" --admin-user postgres --admin-password-env TEST_POSTGRES_PASSWORD --application-password-env TEST_POSTGRES_APPLICATION_PASSWORD --passfile "$RUNNER_TEMP/xpj-pgpass-${GITHUB_RUN_ID}-${GITHUB_JOB}" --output "$GITHUB_ENV"

      - &postgres_install_dependencies
        name: Install dependencies
        run: |
          python -m venv .ci-venv
          ./.ci-venv/bin/python -m pip install --upgrade pip
          ./.ci-venv/bin/python -m pip install -r requirements-dev.txt

      - name: Prepare ordinary lane database
        env: &postgres_prepare_environment
          XPJ_TEST_APPLICATION_PASSWORD: xpj-app-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./.ci-venv/bin/python -m scripts.prepare_test_postgres_databases --role base --expected-major "${{ matrix.postgres-major }}"

      - name: PostgreSQL parallel pytest lane
        # Ordinary tests own one database/data root per fixed xdist worker.
        run: ./.ci-venv/bin/python -m scripts.run_postgres_pytest_lane --lane ordinary --workers 4

      - &postgres_remove_passfile
        name: Remove PostgreSQL passfile
        if: ${{ always() }}
        run: rm -f -- "$PGPASSFILE"

  backend_postgres_real_db:
    name: Backend PostgreSQL / real-db
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.postgres != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy: *postgres_test_strategy
    outputs:
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    services:
      postgres: *postgres_test_service
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - *postgres_setup_python
      - *postgres_qualification
      - *postgres_load_contract
      - *postgres_install_dependencies

      - name: Prepare real-db lane database
        env: *postgres_prepare_environment
        run: ./.ci-venv/bin/python -m scripts.prepare_test_postgres_databases --role base --expected-major "${{ matrix.postgres-major }}"

      - name: PostgreSQL real-db serial pytest lane
        run: ./.ci-venv/bin/python -m scripts.run_postgres_pytest_lane --lane real-db --workers 1

      - *postgres_remove_passfile

  backend_postgres_recovery:
    name: Backend PostgreSQL / smoke + recovery
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.postgres != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy: *postgres_test_strategy
    outputs:
      qualification_sha: ${{ steps.qualification.outputs.sha }}
      qualification_source_sha: ${{ steps.qualification.outputs.source_sha }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    services:
      postgres: *postgres_test_service
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - *postgres_setup_python
      - *postgres_qualification
      - *postgres_load_contract

      - name: Install supported PostgreSQL client
        # The backup tools must match the service-container major selected by
        # this job's supported-base matrix coordinate.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-${{ matrix.postgres-major }}"
          echo "/usr/lib/postgresql/${{ matrix.postgres-major }}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${{ matrix.postgres-major }}/bin:$PATH"
          pg_dump --version
          pg_restore --version

      - *postgres_install_dependencies

      - name: Prepare smoke and recovery databases
        env: *postgres_prepare_environment
        run: ./.ci-venv/bin/python -m scripts.prepare_test_postgres_databases --role smoke --role restore --expected-major "${{ matrix.postgres-major }}"

      - name: PostgreSQL end-to-end smoke (ADR-0041)
        run: ./.ci-venv/bin/python scripts/smoke_test.py

      - name: PostgreSQL backup/restore recovery drill (ADR-0041 phase-2)
        # A backup without a restore drill is not qualification evidence. Dump
        # xpj_smoke through production backup code, restore into xpj_restore,
        # then compare the expected data before this ephemeral job exits.
        run: ./.ci-venv/bin/python scripts/postgres_backup_drill.py

      - *postgres_remove_passfile

  backend-postgres:
    name: Backend (PostgreSQL)
    needs:
      - scope
      - backend_postgres_ordinary
      - backend_postgres_real_db
      - backend_postgres_recovery
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify qualification SHA
        id: qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"

      - name: Enforce PostgreSQL lane results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          POSTGRES_SCOPE: ${{ needs.scope.outputs.postgres }}
          ORDINARY_RESULT: ${{ needs.backend_postgres_ordinary.result }}
          REAL_DB_RESULT: ${{ needs.backend_postgres_real_db.result }}
          RECOVERY_RESULT: ${{ needs.backend_postgres_recovery.result }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AGGREGATOR_SHA: ${{ steps.qualification.outputs.sha }}
          AGGREGATOR_SOURCE_SHA: ${{ steps.qualification.outputs.source_sha }}
          SCOPE_SHA: ${{ needs.scope.outputs.qualification_sha }}
          SCOPE_SOURCE_SHA: ${{ needs.scope.outputs.qualification_source_sha }}
          ORDINARY_SHA: ${{ needs.backend_postgres_ordinary.outputs.qualification_sha }}
          ORDINARY_SOURCE_SHA: ${{ needs.backend_postgres_ordinary.outputs.qualification_source_sha }}
          REAL_DB_SHA: ${{ needs.backend_postgres_real_db.outputs.qualification_sha }}
          REAL_DB_SOURCE_SHA: ${{ needs.backend_postgres_real_db.outputs.qualification_source_sha }}
          RECOVERY_SHA: ${{ needs.backend_postgres_recovery.outputs.qualification_sha }}
          RECOVERY_SOURCE_SHA: ${{ needs.backend_postgres_recovery.outputs.qualification_source_sha }}
        run: python -E -S backend/scripts/verify_postgres_ci_results.py

  desktop-manager:
    name: Desktop manager
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.desktop != 'false') }}
    # The Windows tray/service manager (desktop/). Added after the original
    # ci.yml — pinned in _audit_ci_gap.py so the whole job can't silently vanish.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt python-dotenv pytest ruff

      - name: Compile
        run: .\.ci-venv\Scripts\python.exe -m compileall backend_manager tests

      - name: Lint
        run: .\.ci-venv\Scripts\ruff.exe check backend_manager tests

      - name: Test
        run: .\.ci-venv\Scripts\python.exe -m pytest -q

  android:
    name: Android
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.android != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
        shell: bash
    env:
      # Canonical owner server URL so BuildConfig.DEFAULT_SERVER_URL is populated
      # without a hardcoded domain in build.gradle.kts. Value comes from the repo
      # Actions variable (defense-in-depth: keep the origin host out of the public
      # workflow file — set it via `gh variable set TICKETBOX_SERVER_URL`).
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # assertAndroidTestCountEqualsBaseline reads the base baseline via
          # ``git show <base_ref>:android/audit/test_count_baseline.txt`` for the
          # ratchet check; fetch-depth: 0 makes the base ref reachable.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Point Gradle at cloud Android SDK
        run: |
          sdk_dir="${ANDROID_HOME//\\/\\\\}"
          echo "sdk.dir=$sdk_dir" > local.properties
          echo "ticketbox.serverUrl=$TICKETBOX_SERVER_URL" >> local.properties

      - name: Tune Gradle for cloud runner
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
            echo "kotlin.daemon.jvmargs=-Xmx2560m"
          } >> gradle.properties

      - name: Gradle / JVM versions
        run: ./gradlew --no-daemon --version

      - name: Force regenerate latest Room schema
        # --rerun-tasks is the FROM-CACHE proofing that makes the schema-drift
        # gate non-vacuous: Room's KSP is incremental and SKIPS overwriting an
        # existing schema JSON when the entity hash is unchanged (even if the
        # committed file is a wrong placeholder). Deleting the latest version's
        # file + forcing KSP is the only reliable fresh-write trigger.
        run: |
          schema_dir="app/schemas/com.ticketbox.data.local.AppDatabase"
          latest="$(find "$schema_dir" -maxdepth 1 -name '*.json' -printf '%f\n' | sed 's/\.json$//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          if [ -n "$latest" ]; then
            echo "Deleting $latest.json to force KSP regeneration"
            rm -f "$schema_dir/$latest.json"
          fi
          ./gradlew --no-daemon --max-workers=2 :app:kspGrayDebugKotlin --rerun-tasks

      - name: Compile and unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:compileGrayDebugKotlin :app:testGrayDebugUnitTest

      - name: Verify Room schema snapshots are committed
        # Run from repo root: with working-directory android a path like
        # ``android/app/schemas`` would resolve to ``android/android/...`` and
        # git would silently return empty (codex round-6 P1).
        working-directory: ${{ github.workspace }}
        run: |
          status="$(git status --porcelain android/app/schemas)"
          if [ -n "$status" ]; then
            echo "::error::Room KSP regenerated schema files that are not committed."
            echo "$status"
            git diff -- android/app/schemas
            exit 1
          fi
          echo "Room schema snapshots match the committed files"

      - name: Upload regenerated Room schemas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: room-schemas-regenerated
          path: android/app/schemas/com.ticketbox.data.local.AppDatabase/
          if-no-files-found: error
          retention-days: 14

      - name: Android verification (count baseline + lint + detekt)
        # Kotlin complexity gate (CODE_QUALITY_STANDARDS.md): detekt 2.x runs
        # LongParameterList only under type resolution, so BOTH variant tasks
        # are pinned — the plain :app:detekt would be a weaker gate.
        run: ./gradlew --no-daemon --max-workers=2 :app:assertAndroidTestCountEqualsBaseline :app:lintGrayDebug :app:detektGrayDebug :app:detektGrayDebugUnitTest

      - name: Android debug APK builds
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleGrayDebug :app:assembleInternalDebug

      - name: Detect release APK scope
        id: release-apk-scope
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "release_apk_required=true" >> "$GITHUB_OUTPUT"
            echo "Release APK builds required for non-PR events."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "${base}...${head}")"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -E '^(android/|\.github/workflows/|\.gitea/workflows/)' >/dev/null; then
            echo "release_apk_required=true" >> "$GITHUB_OUTPUT"
            echo "Release APK builds required by Android/CI changes."
          else
            echo "release_apk_required=false" >> "$GITHUB_OUTPUT"
            echo "Release APK builds skipped for PR without Android/CI changes."
          fi

      - name: Android release APK builds
        if: steps.release-apk-scope.outputs.release_apk_required == 'true'
        # Release builds run R8 minify + shrinkResources, keeping keep-rules warm
        # in CI instead of discovering Retrofit/Moshi issues only on a manual
        # release assemble. Keep both release variants in one Gradle invocation:
        # Two workers let the flavor-specific R8/resource pipelines overlap
        # while both variants still share one configuration and daemon. A clean
        # local no-build-cache benchmark reduced this lane from 438s to 300s.
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleGrayRelease :app:assembleInternalRelease

      - name: Skip Android release APK builds
        if: steps.release-apk-scope.outputs.release_apk_required != 'true'
        run: echo "Release APK builds are path-gated for this PR."

      - name: Verify debug APK signing certificate
        # Compute the expected fingerprint from the committed debug keystore
        # rather than hardcoding it, so a deliberate keystore rotation doesn't
        # need a CI edit while an accidental signing-identity change still fails.
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected="$(
            keytool -exportcert -rfc \
              -keystore config/debug/ticketbox-debug.keystore \
              -storepass ticketbox-debug \
              -alias ticketbox-debug |
            openssl x509 -noout -fingerprint -sha256 |
            awk -F= '{print $2}' |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )"
          for apk in \
            app/build/outputs/apk/gray/debug/app-gray-debug.apk \
            app/build/outputs/apk/internal/debug/app-internal-debug.apk
          do
            actual="$("$apksigner" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Unexpected debug signing certificate for $apk - expected $expected got $actual"
              exit 1
            fi
            echo "OK signing certificate $apk"
          done

      - name: NVD cache key (UTC date)
        id: nvd-key
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["plugins"]["owasp-dependency-check"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore validated OWASP NVD database
        id: nvd-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-v${{ steps.nvd-key.outputs.version }}-${{ runner.os }}-${{ steps.nvd-key.outputs.date }}
          restore-keys: |
            nvd-v${{ steps.nvd-key.outputs.version }}-${{ runner.os }}-

      - name: Dependency vulnerability scan
        id: dependency-audit
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python ../backend/scripts/android_dependency_audit.py \
            --gradlew "$PWD/gradlew" \
            --trusted-dir "$HOME/.gradle/dependency-check-data" \
            --work-dir "$HOME/.gradle/dependency-check-work" \
            --cache-hit "${{ steps.nvd-cache.outputs.cache-hit }}" \
            --output "$GITHUB_OUTPUT" \
            --log owasp-output.log

      - name: Save validated OWASP NVD database
        id: nvd-cache-save
        if: steps.dependency-audit.outputs.cache-save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-v${{ steps.nvd-key.outputs.version }}-${{ runner.os }}-${{ steps.nvd-key.outputs.date }}

      - name: Upload gray debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ticketbox-gray-debug-apk
          path: android/app/build/outputs/apk/gray/debug/app-gray-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload internal debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ticketbox-internal-debug-apk
          path: android/app/build/outputs/apk/internal/debug/app-internal-debug.apk
          if-no-files-found: error
          retention-days: 7

# The instrumented (emulator) lane lives in
# .github/workflows/android-connected-test.yml — path-filtered to Android
# sources, with Enable KVM (hardware accel) so the emulator actually boots.
# CodeQL SAST (4 scripted languages + Android java-kotlin) lives in
# .github/workflows/codeql.yml.
