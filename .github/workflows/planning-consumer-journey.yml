name: Isolated existing Room counterexamples

on:
  workflow_dispatch:
    inputs:
      group:
        required: true
        default: notifications
        type: string

permissions:
  contents: read

jobs:
  room:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TICKETBOX_SERVER_URL: http://127.0.0.1:18880
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version-file: android/.java-version
          verify-signature: true
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Compile the existing app and instrumentation
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleGrayDebug :app:assembleGrayDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute existing Room claim and transaction assertions
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python backend/scripts/t3_room_counterexample.py
      - name: Preserve exact source and existing test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3-room-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: t3-room-evidence
          if-no-files-found: error
