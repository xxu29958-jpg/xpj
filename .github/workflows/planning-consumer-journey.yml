name: Planning consumer journey

# A bounded product-acceptance run, repeatable on the final integrated ref.
# Existing CI/Connected remain the general change gates.
on:
  workflow_dispatch:
    inputs:
      group:
        description: Actual consumer group to exercise
        type: choice
        options: [budget-recurring, income-goals, relationships, portable-downloads, backstage, notifications, reference-library, financial-facts, original-maintenance, insights, appearance, cold-copy]
        default: budget-recurring
      installer_run_id:
        description: For cold-copy only, the CI run containing this exact SHA's installer
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/planning-consumer-journey.yml
      - backend/scripts/**.py
  push:
    branches: [main]
    paths:
      - .github/workflows/planning-consumer-journey.yml
      - backend/scripts/**.py

permissions:
  contents: read
  actions: read

jobs:
  selection:
    name: Select actual journey consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      consumers: ${{ steps.selection.outputs.consumers }}
      cold_copy: ${{ steps.selection.outputs.cold_copy }}
      artifact_name: planning-selection-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Resolve exact changed-script consumers or explicit group
        id: selection
        working-directory: backend
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_GROUP: ${{ inputs.group }}
          INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
        run: >-
          python -E -S -m scripts.planning_journey_scope
          --event "$EVENT_NAME" --base "$DIFF_BASE" --source "$SOURCE_SHA"
          --requested "$REQUESTED_GROUP" --installer-run-id "$INSTALLER_RUN_ID"
          --evidence ../planning-selection
      - name: Preserve the selection and exact subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: planning-selection-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: planning-selection
          if-no-files-found: error

  postgres_policy:
    needs: selection
    if: ${{ needs.selection.outputs.consumers == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.policy.outputs.image }}
      major: ${{ steps.policy.outputs.major }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: policy
        working-directory: backend
        run: |
          python -E -S -c 'from scripts.postgres_release_policy import load_postgres_release_policy; p = load_postgres_release_policy(); print("image=" + p.service_image); print("major=" + str(p.current_major))' >> "$GITHUB_OUTPUT"

  app:
    name: Build the shared journey APK
    needs: selection
    if: ${{ needs.selection.outputs.consumers == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: planning-app-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    env:
      TICKETBOX_SERVER_URL: http://127.0.0.1:18880
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version-file: android/.java-version
          verify-signature: true
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build the actual native app once for the selected consumers
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleGrayDebug
      - name: Build the notification journey runtime probe
        if: ${{ contains(fromJSON(needs.selection.outputs.matrix).group, 'notifications') }}
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleGrayDebugAndroidTest
      - name: Bind the APK files that the consumers will install
        working-directory: android/app/build/outputs/apk
        run: find . -name '*.apk' -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: planning-app-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: android/app/build/outputs/apk
          if-no-files-found: error

  consumers:
    name: Actual Web and Android consumers / ${{ matrix.group }}
    needs: [selection, postgres_policy, app]
    if: ${{ needs.selection.outputs.consumers == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    concurrency:
      group: planning-consumers-${{ github.ref }}-${{ matrix.group }}
      cancel-in-progress: true
    services:
      postgres:
        image: ${{ needs.postgres_policy.outputs.image }}
        env:
          POSTGRES_PASSWORD: xpj-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    env:
      TICKETBOX_SERVER_URL: http://127.0.0.1:18880
      TICKETBOX_JOURNEY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TICKETBOX_JOURNEY_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Verify exact checkout and source
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -E -S backend/scripts/report_qualification_sha.py --expected "$EXPECTED_SHA" --source "$SOURCE_SHA" --output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Prepare isolated PostgreSQL connection
        working-directory: backend
        env:
          TEST_POSTGRES_PASSWORD: xpj-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_POSTGRES_APPLICATION_PASSWORD: xpj-app-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -E -S -m scripts.write_test_postgres_env --host localhost --port "${{ job.services.postgres.ports[5432] }}" --admin-user postgres --admin-password-env TEST_POSTGRES_PASSWORD --application-password-env TEST_POSTGRES_APPLICATION_PASSWORD --passfile "$RUNNER_TEMP/planning.pgpass" --output "$GITHUB_ENV"
      - name: Install journey dependencies
        working-directory: backend
        run: |
          python -m venv .ci-venv
          ./.ci-venv/bin/python -m pip install -r requirements-dev.txt playwright==1.58.0
          ./.ci-venv/bin/python -m playwright install --with-deps chromium
      - name: Install the actual OCR provider for the Backstage journey
        if: ${{ env.TICKETBOX_JOURNEY_GROUP == 'backstage' }}
        working-directory: backend
        run: |
          ./.ci-venv/bin/python -m pip install -r requirements-ocr.txt
          sudo apt-get install -y fonts-noto-cjk
      - name: Install the sample receipt font for original and financial journeys
        if: ${{ env.TICKETBOX_JOURNEY_GROUP == 'original-maintenance' || env.TICKETBOX_JOURNEY_GROUP == 'financial-facts' }}
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Prepare the existing sealed smoke database
        working-directory: backend
        env:
          XPJ_TEST_APPLICATION_PASSWORD: xpj-app-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./.ci-venv/bin/python -m scripts.prepare_test_postgres_databases --role smoke --expected-major "${{ needs.postgres_policy.outputs.major }}"
      - name: Download the APK built for this selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.app.outputs.artifact_name }}
          path: android/app/build/outputs/apk
      - name: Verify the exact APK files before installation
        working-directory: android/app/build/outputs/apk
        run: sha256sum --check SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use the same ledger from actual Web and native consumers
        id: journey
        # The full two-leg history/restart journey exceeded 25m on the same main tree.
        # Keep every business assertion and grant only this group a bounded margin.
        timeout-minutes: ${{ (matrix.group == 'relationships' || matrix.group == 'reference-library') && 35 || 25 }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: backend
          script: ./.ci-venv/bin/python -m scripts.planning_consumer_journey --serial emulator-5554 --apk ../android/app/build/outputs/apk/gray/debug/app-gray-debug.apk --evidence "../planning-consumer-evidence/$TICKETBOX_JOURNEY_GROUP" --group "$TICKETBOX_JOURNEY_GROUP"
      - name: Bind the business result to the executed group and APK
        if: ${{ always() }}
        working-directory: backend
        env:
          JOURNEY_OUTCOME: ${{ steps.journey.outcome }}
        run: >-
          python -E -S -m scripts.planning_journey_results record
          --evidence "../planning-consumer-evidence/$TICKETBOX_JOURNEY_GROUP"
          --apk ../android/app/build/outputs/apk/gray/debug/app-gray-debug.apk
      - name: Preserve the actual consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: planning-consumers-${{ matrix.group }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: planning-consumer-evidence/${{ matrix.group }}
          if-no-files-found: error
      - name: Remove temporary PostgreSQL credentials
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}
        run: rm -f -- "$RUNNER_TEMP/planning.pgpass"

  qualification:
    name: Qualify selected consumer results
    needs: [selection, consumers]
    if: ${{ always() && needs.selection.outputs.cold_copy != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download the actual selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.selection.outputs.artifact_name }}
          path: planning-selection
      - name: Download group executions with their business results
        if: ${{ needs.selection.outputs.consumers == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: planning-consumers-*-${{ github.run_id }}-attempt-*
          path: planning-results
          merge-multiple: false
      - name: Require the selected groups and matching checkout, source and APK
        working-directory: backend
        env:
          TICKETBOX_JOURNEY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
        run: >-
          python -E -S -m scripts.planning_journey_results verify
          --selection ../planning-selection/selection.json --evidence ../planning-results
      - name: Preserve the qualification result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: planning-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: planning-results/qualification.json
          if-no-files-found: error

  cold-copy:
    name: Installed cold copy and separate PostgreSQL readability
    needs: selection
    if: ${{ needs.selection.outputs.cold_copy == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    concurrency:
      group: planning-consumers-${{ github.ref }}-cold-copy
      cancel-in-progress: true
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Download only the exact candidate's installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if ($env:INSTALLER_RUN_ID -notmatch '^\d+$') { throw 'Invalid run ID.' }
          $actual = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN_ID" --jq '.head_sha'
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) { throw 'Installer source SHA mismatch.' }
          gh run download $env:INSTALLER_RUN_ID --repo $env:GITHUB_REPOSITORY --name ticketbox-windows-installer --dir "$env:RUNNER_TEMP\cold-installer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Operate the installed cold-copy command and read the separate PG copy
        shell: powershell
        run: |
          $installers = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\cold-installer" -Filter 'Ticketbox-Setup-*.exe' -Recurse -File)
          if ($installers.Count -ne 1) { throw 'Expected one exact installer.' }
          python distribution/windows/qualification/cold_copy_drill.py --installer $installers[0].FullName --evidence "$env:RUNNER_TEMP\cold-copy-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload business results only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cold-copy-business-result
          path: ${{ runner.temp }}/cold-copy-evidence/business-result.json
          if-no-files-found: error
