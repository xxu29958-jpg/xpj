name: iOS Shortcuts environment probe

# Disposable environment probe; this branch is not a product change for merging.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortcuts_environment:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout the actual backend
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up the backend Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Inspect and launch the system iPhone Shortcuts app
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import platform
          import subprocess
          import time

          output = pathlib.Path("ios-shortcuts-environment")
          output.mkdir()
          result = {"scope": "environment-only", "source_sha": os.environ["GITHUB_SHA"],
                    "runner_image": os.environ.get("ImageVersion"), "host_architecture": platform.machine(),
                    "shortcuts_installed": False,
                    "shortcuts_launched": False}

          def read(*args):
              return subprocess.check_output(args, text=True).strip()

          try:
              result["xcode"] = read("xcodebuild", "-version")
              runtimes = json.loads(read("xcrun", "simctl", "list", "runtimes", "--json"))["runtimes"]
              ios = [r for r in runtimes if r.get("isAvailable") and ".iOS-" in r["identifier"]]
              result["available_ios_runtimes"] = [{key: r.get(key) for key in ("identifier", "version", "buildversion")} for r in ios]
              comparison = [r for r in ios if r["version"].startswith("26.4")]
              if not comparison:
                  raise RuntimeError("The iOS 26.4 comparison runtime is unavailable")
              runtime = comparison[0]
              result["runtime"] = {key: runtime.get(key) for key in ("identifier", "version", "buildversion", "bundlePath")}
              devices = json.loads(read("xcrun", "simctl", "list", "devices", "available", "--json"))["devices"]
              phones = [d for d in devices.get(runtime["identifier"], []) if d["name"].startswith("iPhone")]
              if phones:
                  device = phones[0]
                  device_id = device["udid"]
                  result["device"] = device["name"]
              else:
                  types = runtime.get("supportedDeviceTypes", [])
                  phone = next((d for d in types if d.get("productFamily") == "iPhone" or d.get("name", "").startswith("iPhone")), None)
                  if phone is None:
                      raise RuntimeError("No compatible iPhone device definition in the available runtime")
                  device_id = read("xcrun", "simctl", "create", "Ticketbox Shortcut Probe", phone["identifier"], runtime["identifier"])
                  result["device"] = phone["name"]
              result["device_id"] = device_id
              subprocess.run(["xcrun", "simctl", "boot", device_id], check=False, capture_output=True)
              subprocess.run(["xcrun", "simctl", "bootstatus", device_id, "-b"], check=True, capture_output=True, timeout=600)
              container = subprocess.run(["xcrun", "simctl", "get_app_container", device_id, "com.apple.shortcuts", "app"], capture_output=True, text=True)
              result["shortcuts_installed"] = container.returncode == 0
              launch = subprocess.run(["xcrun", "simctl", "launch", device_id, "com.apple.shortcuts"], capture_output=True, text=True)
              result["shortcuts_launched"] = launch.returncode == 0
              if launch.returncode:
                  result["launch_error"] = launch.stderr[-1600:]
              time.sleep(5)
              subprocess.run(["xcrun", "simctl", "io", device_id, "screenshot", str(output / "shortcuts.png")], check=True, capture_output=True)
          except Exception as error:
              result["error"] = str(error)
          finally:
              (output / "environment.json").write_text(json.dumps(result, ensure_ascii=False, indent=2))
              print(json.dumps(result, ensure_ascii=False, indent=2))
          raise SystemExit(0 if result["shortcuts_installed"] and result["shortcuts_launched"] else 1)
          PY
      - name: Install the isolated backend dependencies
        shell: bash
        run: |
          python -m venv backend/.ci-venv
          backend/.ci-venv/bin/python -m pip install -r backend/requirements-dev.txt
          brew install postgresql@17
      - name: Browse the real URL upload action with the isolated backend ready
        shell: bash
        run: |
          backend/.ci-venv/bin/python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          sys.path.insert(0, str(pathlib.Path("backend").resolve()))
          from scripts.ios_shortcuts_backend_probe import run_with_upload_backend

          output = pathlib.Path("ios-shortcuts-environment").resolve()
          environment = json.loads((output / "environment.json").read_text())
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ShortcutProbe"
          project = root / "ShortcutProbe.xcodeproj"
          schemes = project / "xcshareddata" / "xcschemes"
          schemes.mkdir(parents=True)
          (root / "Probe.swift").write_text('''import XCTest
          final class ShortcutProbe: XCTestCase {
              @MainActor func testSystemUploadActionCanBeAdded() {
                  continueAfterFailure = false
                  let app = XCUIApplication(bundleIdentifier: "com.apple.shortcuts")
                  // Keep the system app and its action catalog alive from the environment step.
                  app.activate()
                  XCTAssertEqual(app.state, .runningForeground)
                  print("SHORTCUTS_UI_TREE_BEGIN\\n\\(app.debugDescription)\\nSHORTCUTS_UI_TREE_END")
                  let create = app.buttons.matching(NSPredicate(format: "label == %@ OR label == %@", "Create Shortcut", "add")).firstMatch
                  XCTAssertTrue(create.waitForExistence(timeout: 10))
                  create.tap()
                  XCTAssertEqual(app.state, .runningForeground)
                  print("SHORTCUTS_EDITOR_UI_TREE_BEGIN\\n\\(app.debugDescription)\\nSHORTCUTS_EDITOR_UI_TREE_END")
                  let web = app.buttons["Web"]
                  XCTAssertTrue(web.waitForExistence(timeout: 10))
                  let categories = app.scrollViews.containing(.button, identifier: "Web").firstMatch
                  for _ in 0..<4 {
                      if web.isHittable { break }
                      categories.swipeLeft()
                  }
                  XCTAssertTrue(web.isHittable)
                  web.tap()
                  let action = app.descendants(matching: .any).matching(NSPredicate(format: "label == %@", "Get Contents of URL")).firstMatch
                  // A fresh simulator starts its full ToolKit index after the editor is already visible.
                  // Wait for the real action, not merely the app or category to be present.
                  let foundAction = action.waitForExistence(timeout: 240)
                  print("SHORTCUTS_WEB_CATEGORY_UI_TREE_BEGIN\\n\\(app.debugDescription)\\nSHORTCUTS_WEB_CATEGORY_UI_TREE_END")
                  let categoryTree = XCTAttachment(string: app.debugDescription)
                  categoryTree.name = "Observed Web action category"
                  categoryTree.lifetime = .keepAlways
                  add(categoryTree)
                  let categoryScreen = XCTAttachment(screenshot: app.screenshot())
                  categoryScreen.name = "Observed Web action category"
                  categoryScreen.lifetime = .keepAlways
                  add(categoryScreen)
                  XCTAssertTrue(foundAction)
                  action.tap()
                  print("SHORTCUTS_URL_ACTION_UI_TREE_BEGIN\\n\\(app.debugDescription)\\nSHORTCUTS_URL_ACTION_UI_TREE_END")
                  let tree = XCTAttachment(string: app.debugDescription)
                  tree.name = "URL action editor accessibility tree"
                  tree.lifetime = .keepAlways
                  add(tree)
                  let screen = XCTAttachment(screenshot: app.screenshot())
                  screen.name = "URL action added through XCTest"
                  screen.lifetime = .keepAlways
                  add(screen)
                  let request = app.otherElements.matching(NSPredicate(format: "label == %@", "Get contents of , URL")).firstMatch
                  XCTAssertTrue(request.waitForExistence(timeout: 10))
                  // The system's accessibility element groups the URL chip and disclosure control.
                  // This point is the blue disclosure in the captured iPhone 17 Pro action row.
                  request.coordinate(withNormalizedOffset: CGVector(dx: 0.725, dy: 0.5)).tap()
                  let optionsTree = XCTAttachment(string: app.debugDescription)
                  optionsTree.name = "URL request options accessibility tree"
                  optionsTree.lifetime = .keepAlways
                  add(optionsTree)
                  let optionsScreen = XCTAttachment(screenshot: app.screenshot())
                  optionsScreen.name = "URL request options"
                  optionsScreen.lifetime = .keepAlways
                  add(optionsScreen)
                  XCTAssertTrue(app.descendants(matching: .any).matching(NSPredicate(format: "label CONTAINS %@", "Method")).firstMatch.waitForExistence(timeout: 10))
                  app.buttons["GET"].tap()
                  let post = app.buttons["POST"]
                  XCTAssertTrue(post.waitForExistence(timeout: 10))
                  post.tap()
                  let postTree = XCTAttachment(string: app.debugDescription)
                  postTree.name = "POST request body choices accessibility tree"
                  postTree.lifetime = .keepAlways
                  add(postTree)
                  let bodyType = app.buttons.matching(NSPredicate(format: "label == %@ OR label == %@", "JSON", "Form")).firstMatch
                  XCTAssertTrue(bodyType.waitForExistence(timeout: 10))
                  bodyType.tap()
                  let file = app.buttons["File"]
                  XCTAssertTrue(file.waitForExistence(timeout: 10))
                  file.tap()
                  XCTAssertTrue(app.buttons["POST"].exists)
                  XCTAssertTrue(app.buttons["File"].exists)
                  let fileTree = XCTAttachment(string: app.debugDescription)
                  fileTree.name = "POST file request accessibility tree"
                  fileTree.lifetime = .keepAlways
                  add(fileTree)
                  let fileScreen = XCTAttachment(screenshot: app.screenshot())
                  fileScreen.name = "POST file request configured through the system UI"
                  fileScreen.lifetime = .keepAlways
                  add(fileScreen)
                  app.buttons["Choose Variable"].tap()
                  let inputTree = XCTAttachment(string: app.debugDescription)
                  inputTree.name = "Available system file inputs"
                  inputTree.lifetime = .keepAlways
                  add(inputTree)
                  let inputScreen = XCTAttachment(screenshot: app.screenshot())
                  inputScreen.name = "Available system file inputs"
                  inputScreen.lifetime = .keepAlways
                  add(inputScreen)
              }
          }
          ''')
          (project / "project.pbxproj").write_text('''// !$*UTF8*$!
          {
            archiveVersion = 1;
            classes = {};
            objectVersion = 56;
            objects = {
              A00000000000000000000001 = { isa = PBXProject; buildConfigurationList = A00000000000000000000002; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base); mainGroup = A00000000000000000000003; productRefGroup = A00000000000000000000004; projectDirPath = ""; projectRoot = ""; targets = (A00000000000000000000005); };
              A00000000000000000000002 = { isa = XCConfigurationList; buildConfigurations = (A00000000000000000000006); defaultConfigurationIsVisible = 0; defaultConfigurationName = Debug; };
              A00000000000000000000003 = { isa = PBXGroup; children = (A00000000000000000000007, A00000000000000000000004); sourceTree = "<group>"; };
              A00000000000000000000004 = { isa = PBXGroup; children = (A00000000000000000000008); name = Products; sourceTree = "<group>"; };
              A00000000000000000000005 = { isa = PBXNativeTarget; buildConfigurationList = A00000000000000000000009; buildPhases = (A0000000000000000000000A); buildRules = (); dependencies = (); name = ShortcutProbe; productName = ShortcutProbe; productReference = A00000000000000000000008; productType = "com.apple.product-type.bundle.ui-testing"; };
              A00000000000000000000006 = { isa = XCBuildConfiguration; buildSettings = {}; name = Debug; };
              A00000000000000000000007 = { isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Probe.swift; sourceTree = "<group>"; };
              A00000000000000000000008 = { isa = PBXFileReference; explicitFileType = wrapper.cfbundle; includeInIndex = 0; path = ShortcutProbe.xctest; sourceTree = BUILT_PRODUCTS_DIR; };
              A00000000000000000000009 = { isa = XCConfigurationList; buildConfigurations = (A0000000000000000000000B); defaultConfigurationIsVisible = 0; defaultConfigurationName = Debug; };
              A0000000000000000000000A = { isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (A0000000000000000000000C); runOnlyForDeploymentPostprocessing = 0; };
              A0000000000000000000000B = { isa = XCBuildConfiguration; buildSettings = { CODE_SIGNING_ALLOWED = NO; CURRENT_PROJECT_VERSION = 1; GENERATE_INFOPLIST_FILE = YES; IPHONEOS_DEPLOYMENT_TARGET = 26.0; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.ticketbox.qualification.shortcuts; PRODUCT_NAME = "$(TARGET_NAME)"; SDKROOT = iphonesimulator; SUPPORTED_PLATFORMS = iphonesimulator; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = 1; TEST_TARGET_NAME = ""; }; name = Debug; };
              A0000000000000000000000C = { isa = PBXBuildFile; fileRef = A00000000000000000000007; };
            };
            rootObject = A00000000000000000000001;
          }
          ''')
          reference = '<BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="A00000000000000000000005" BuildableName="ShortcutProbe.xctest" BlueprintName="ShortcutProbe" ReferencedContainer="container:ShortcutProbe.xcodeproj" />'
          (schemes / "ShortcutProbe.xcscheme").write_text(f'''<?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="2660" version="1.3">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES"><BuildActionEntries><BuildActionEntry buildForTesting="YES" buildForRunning="NO" buildForProfiling="NO" buildForArchiving="NO" buildForAnalyzing="YES">{reference}</BuildActionEntry></BuildActionEntries></BuildAction>
            <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.IDEFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES"><Testables><TestableReference skipped="NO">{reference}</TestableReference></Testables></TestAction>
          </Scheme>
          ''')
          command = ["xcodebuild", "test", "-project", str(project), "-scheme", "ShortcutProbe",
                     "-destination", "id=" + environment["device_id"], "-parallel-testing-enabled", "NO",
                     "-derivedDataPath", str(root / "DerivedData"), "-resultBundlePath", str(output / "ui-control.xcresult")]
          with (output / "ui-control.log").open("w") as log:
              completed = run_with_upload_backend(command, output=output, log=log)
          subprocess.run(["xcrun", "xcresulttool", "export", "attachments", "--path", str(output / "ui-control.xcresult"),
                          "--output-path", str(output / "attachments")], check=True)
          (output / "ui-control-result.json").write_text(json.dumps({"scope": "environment-only", "xctest_exit_code": completed.returncode}, indent=2))
          print("XCTest exit code:", completed.returncode)
          if completed.returncode:
              print("\n".join((output / "ui-control.log").read_text().splitlines()[-60:]))
          raise SystemExit(completed.returncode)
          PY
      - name: Inspect system action metadata and indexing owners
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          output = pathlib.Path("ios-shortcuts-environment").resolve()
          environment = json.loads((output / "environment.json").read_text())
          device = environment.get("device_id")
          if not device:
              raise SystemExit("No booted iPhone was recorded for metadata inspection")
          prefix = ["xcrun", "simctl", "spawn", device]
          predicate = ('(subsystem CONTAINS[c] "toolkit" OR subsystem CONTAINS[c] "appintent" '
                       'OR subsystem CONTAINS[c] "workflow" OR subsystem CONTAINS[c] "shortcuts" '
                       'OR process CONTAINS[c] "intent" OR process CONTAINS[c] "toolkit") '
                       'AND NOT subsystem BEGINSWITH "com.apple.dt."')
          results = {}
          for name, command in (
              ("simulator-services.log", prefix + ["launchctl", "list"]),
              ("action-indexing.log", prefix + ["log", "show", "--last", "10m", "--style", "compact",
                                               "--info", "--debug", "--predicate", predicate]),
          ):
              with (output / name).open("w") as log:
                  try:
                      result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=60, check=False)
                      results[name] = {"exit_code": result.returncode}
                  except subprocess.TimeoutExpired:
                      results[name] = {"timed_out": True}
          bundle = environment.get("runtime", {}).get("bundlePath")
          resources = {}
          if bundle:
              frameworks = pathlib.Path(bundle) / "Contents/Resources/RuntimeRoot/System/Library/PrivateFrameworks"
              for framework in ("WorkflowKit.framework", "ToolKit.framework", "AppIntentsServices.framework"):
                  path = frameworks / framework
                  resources[framework] = {"exists": path.exists(), "files": [
                      {"path": str(file.relative_to(path)), "bytes": file.stat().st_size}
                      for file in sorted(path.rglob("*")) if file.is_file() and file.suffix in
                      {".plist", ".json", ".intentdefinition", ".actionsdata"}
                  ] if path.exists() else []}
          (output / "action-metadata.json").write_text(json.dumps({
              "scope": "read-only-environment-diagnostics", "commands": results, "resources": resources,
          }, indent=2))
          print(json.dumps({"diagnostic_commands": results, "resource_frameworks": list(resources)}, indent=2))
          PY
      - name: Preserve the observed environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-shortcuts-environment
          path: ios-shortcuts-environment/
          if-no-files-found: error
          retention-days: 7
