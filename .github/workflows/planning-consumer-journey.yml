name: iOS Shortcut signing probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Exercise Apple's signing command with a public fixture
        run: python3 backend/scripts/ios_shortcut_signing_probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shortcut-signing-probe
          path: shortcut-signing-probe
          retention-days: 5
