org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# CI/build speed-up: reuse task outputs via the local build cache. The Android
# CI job runs several separate ./gradlew invocations (unit test, assemble debug
# + release/R8, lint); the cache — kept warm across invocations and across runs
# by setup-gradle (~/.gradle/caches) — lets unchanged tasks hit instead of
# recompiling each time. Only the main GitHub CI Android job publishes cross-run
# build-cache state; every other GitHub lane consumes it read-only and the
# shared Gitea runner disables build-cache writes. Most impactful on test-only
# PRs, where unchanged release tasks hit.
org.gradle.caching=true
