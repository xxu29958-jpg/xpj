org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2560m
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builder.sdkDownload=true
kotlin.code.style=official

# Reuse cacheable task outputs locally and through Gradle's official CI setup.
# Missing SDK packages are resolved from the Gradle Android model after license
# acceptance, so workflows do not duplicate compileSdk/build-tools versions.
org.gradle.caching=true
