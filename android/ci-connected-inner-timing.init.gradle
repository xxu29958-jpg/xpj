def startedNs = System.nanoTime()
def startedMs = System.currentTimeMillis()
gradle.buildFinished { result ->
    def elapsed = (System.nanoTime() - startedNs) / 1000000000.0d
    def rounded = String.format(java.util.Locale.US, "%.3f", elapsed)
    def endedMs = System.currentTimeMillis()
    def failed = result.getFailure() != null
    def json = "{\"kind\":\"gradle_connected_test\",\"elapsed_s\":" + rounded +
        ",\"started_unix_ms\":" + startedMs +
        ",\"ended_unix_ms\":" + endedMs +
        ",\"gradle_failure\":" + failed +
        ",\"not\":\"emulator/action overhead residual lives outside this interval\"}\n"
    def dir = System.getenv("RUNNER_TEMP")
    if (dir == null || dir.isEmpty()) {
        dir = System.getProperty("java.io.tmpdir")
    }
    new File(dir, "connected-inner-timing.json").setText(json, "UTF-8")
}
