<html lang="zh-CN">
<head><meta charset="utf-8"></head>
<body>
  <main class="content">
    <section id="exp-table">
      <div class="exp-row" data-expense-id="1">
        <input class="row-check"
               id="check-1"
               type="checkbox"
               name="expense_snapshot"
               value="1:11"
               form="bulk-form"
               data-id="1"
               data-row-version="11">
        <a class="exp-row-detail"
           id="row-1"
           href="#full-page"
           data-fragment-url="/fragment/1">第一笔</a>
        <div class="exp-flags">
          <form id="quick-confirm">
            <input type="hidden" name="expense_snapshot" value="1:11">
          </form>
        </div>
      </div>
      <div class="exp-row" data-expense-id="2"><a class="exp-row-detail" id="row-2" href="#second" data-fragment-url="/fragment/2">第二笔</a></div>
    </section>
    <form id="bulk-form" data-bulk action="/web/review/bulk">
      <span data-bulk-count>0</span>
      <button type="button" data-bulk-clear>取消选择</button>
      <button type="submit" name="action" value="confirm_ready">确认入账</button>
    </form>
  </main>
  <div class="drawer-host">
    <div id="drawer" tabindex="-1" aria-hidden="true"></div>
  </div>
  <div id="drawer-scrim"></div>
  <script>
    let fragmentFetches = 0;
    let finishRefresh;
    window.fetch = async (_url, options) => {
      if (options && options.method === "POST") return {ok: true};
      fragmentFetches += 1;
      const version = fragmentFetches === 1 ? "11" : "12";
      const fragment = `
          <form data-drawer-form action="/web/expenses/1/save">
            <input type="hidden" name="expected_row_version" value="${version}">
            <input type="hidden" name="idempotency_key" value="original-confirm-key">
            <input name="merchant" value="Saved merchant">
            <details class="review-more-actions"><summary>更多操作</summary><button type="button">菜单项</button></details>
            <button id="drawer-save" type="submit">保存</button>
            <button type="button" data-drawer-close>关闭</button>
          </form>`;
      return {
        ok: true,
        text: async () => fragmentFetches === 3
          ? new Promise(resolve => { finishRefresh = () => resolve(fragment); })
          : fragment
      };
    };
  </script>
  <script src="__BULK_BAR_URI__"></script>
  <script src="__CORE_URI__"></script>
  <script src="__DRAWER_URI__"></script>
  <script src="__SHELL_KEYBOARD_URI__"></script>
  <script>
    (async () => {
      const wait = () => new Promise((resolve) => setTimeout(resolve, 30));
      window.TicketboxWeb.initBulkBar();
      window.TicketboxWeb.initShellKeyboard();
      window.TicketboxWeb.initDrawer();

      const checkbox = document.getElementById("check-1");
      const row = document.getElementById("row-1");
      checkbox.click();
      row.click();
      await wait();

      const drawerForm = document.querySelector("[data-drawer-form]");
      if (!drawerForm) {
        window.__webConsumerProbe = {drawerOpenedWhileSelected: false};
        return;
      }
      const menu = drawerForm.querySelector(".review-more-actions");
      menu.open = true;
      menu.querySelector("summary").focus();
      menu.querySelector("summary").dispatchEvent(new KeyboardEvent("keydown", {key: "Escape", bubbles: true, cancelable: true}));
      const menuEscape = !menu.open && window.TicketboxWeb.drawerApi.isOpen();
      const merchant = drawerForm.elements.namedItem("merchant");
      merchant.value = "Unsaved merchant";
      merchant.dispatchEvent(new Event("input", { bubbles: true }));
      document.getElementById("row-2").click();
      await wait();
      row.click();
      await wait();
      document.getElementById("bulk-form").requestSubmit();
      const retained = {
        sameForm: document.querySelector("[data-drawer-form]") === drawerForm,
        merchant: drawerForm.elements.namedItem("merchant").value,
        version: drawerForm.elements.namedItem("expected_row_version").value,
        key: drawerForm.elements.namedItem("idempotency_key").value,
        fetches: fragmentFetches,
        queueOperable: !document.querySelector("main").inert,
        bulkBlocked: document.getElementById("bulk-flash").textContent.includes("先保存草稿")
      };
      drawerForm.dispatchEvent(new SubmitEvent("submit", {
        bubbles: true,
        cancelable: true,
        submitter: document.getElementById("drawer-save")
      }));
      await wait();
      document.getElementById("row-2").click();
      const refreshPreservesTarget = window.TicketboxWeb.drawerApi.currentRow() === row;
      finishRefresh();
      await wait();

      const bulkTokens = Array.from(
        document.querySelectorAll('#bulk-form input[name="expected_row_version"]')
      ).map((node) => node.value);
      window.__webConsumerProbe = {
        menuEscape,
        refreshPreservesTarget,
        retained,
        drawerOpenedWhileSelected: true,
        checkboxChecked: checkbox.checked,
        checkboxDataRowVersion: checkbox.getAttribute("data-row-version"),
        checkboxValue: checkbox.value,
        quickConfirmSnapshot: document.querySelector(
          '#quick-confirm input[name="expense_snapshot"]'
        ).value,
        bulkTokens,
        selectedCount: document.querySelector("[data-bulk-count]").textContent
      };
    })();
  </script>
</body>
</html>
