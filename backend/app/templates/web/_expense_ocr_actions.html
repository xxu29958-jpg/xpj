{% if e.status == 'pending' %}
<section aria-label="识别建议">
  {% if can_write %}
  <div class="product-page-actions">
    <a class="product-button product-button--quiet" href="{{ edit_current_href | replace('/edit?', '/recognize-text?') }}">粘贴小票文字</a>
    {% if e.has_image %}<a class="product-button product-button--quiet" href="{{ edit_current_href | replace('/edit?', '/ocr/retry?') }}">重试识别</a>{% endif %}
  </div>
  <p class="product-drawer-meta">识别只提供建议，请核对后再确认。之前未保存的填写会保留。</p>
  {% endif %}
  {% if not e.has_image %}
  <p class="product-drawer-meta">没有原图，无法重试图片识别。可粘贴小票文字提取字段，或继续手动补全。</p>
  {% endif %}
</section>
{% endif %}
