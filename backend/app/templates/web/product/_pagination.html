{% if total_pages > 1 %}
<nav class="product-pagination" aria-label="分页">
  {% if page > 1 %}
  <a class="product-button product-button--quiet" href="?{{ pager_query }}&page={{ page - 1 }}" rel="prev">上一页</a>
  {% endif %}
  <span class="pager-info">第 {{ page }} / {{ total_pages }} 页 · 共 {{ total }} 条</span>
  {% if page < total_pages %}
  <a class="product-button product-button--quiet" href="?{{ pager_query }}&page={{ page + 1 }}" rel="next">下一页</a>
  {% endif %}
</nav>
{% endif %}
