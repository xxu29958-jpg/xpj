name: Windows CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "perf/**"
      - "refactor/**"
      - "codex/**"
  workflow_dispatch:
    inputs:
      adr_base_ref:
        description: Canonical default-branch divergence commit for ADR history ratchets
        required: true
        type: string

jobs:
  backend-full:
    name: Backend full checks
    runs-on: windows-latest
    timeout-minutes: 70

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout (offline — local Gitea, no github.com)
        working-directory: ${{ github.workspace }}
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          $ws = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $ws | Out-Null
          Get-ChildItem -LiteralPath $ws -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          git init -q $ws
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          $server = $env:GITHUB_SERVER_URL.TrimEnd('/')
          $origin = "$server/$env:GITHUB_REPOSITORY.git"
          if (@(git -C $ws remote) -contains "origin") {
            git -C $ws remote set-url origin $origin
          } else {
            git -C $ws remote add origin $origin
          }
          if ($LASTEXITCODE -ne 0) { throw "git remote setup failed" }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:REPO_TOKEN"))
          git -C $ws -c "http.extraheader=AUTHORIZATION: basic $b64" -c protocol.version=2 fetch -q --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          if ($LASTEXITCODE -ne 0) { throw "git fetch from local Gitea failed" }
          git -C $ws checkout -q -f $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git checkout $env:GITHUB_SHA failed" }
          git -C $ws log --oneline -1

      - name: Verify Gitea runner lifecycle contract
        timeout-minutes: 2
        run: .\backend\scripts\assert_gitea_runner_contract.ps1

      - name: Tool versions
        run: |
          git --version
          python --version

      - name: Check PowerShell scripts
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\check_text_encoding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File scripts\check_dependency_versions.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $roots = @("backend/scripts", "backend/packaging", "desktop/scripts", "android/scripts", "scripts") | Where-Object { Test-Path $_ }
          $files = Get-ChildItem -Path $roots -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if (-not $hasBom) {
              throw "$($file.FullName) must be UTF-8 with BOM for Windows PowerShell 5.1"
            }
            $errors = $null
            [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw -Encoding UTF8 -LiteralPath $file.FullName), [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$($file.FullName) syntax error: $($errors[0].Message)"
            }
            Write-Host "OK $($file.FullName)"
          }

      - name: Install backend dependencies
        working-directory: backend
        run: |
          if (Test-Path .ci-venv) { Remove-Item -Recurse -Force .ci-venv }
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.ci-venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Compile backend
        working-directory: backend
        run: .\.ci-venv\Scripts\python.exe -m compileall app scripts tests packaging/tests

      - name: Lint backend
        working-directory: backend
        run: .\.ci-venv\Scripts\ruff.exe check app scripts tests packaging/tests

      - name: Windows installer safety behavior
        timeout-minutes: 20
        working-directory: backend
        env:
          XPJ_REQUIRE_WINDOWS_LIFECYCLE_RUNTIME: "1"
        run: .\.ci-venv\Scripts\python.exe scripts\run_packaging_tests.py

      - name: Installer source preflight (Windows PowerShell 5.1)
        working-directory: backend
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -CheckSourceInputsOnly

      - name: Installer source preflight (PowerShell 7)
        working-directory: backend
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -CheckSourceInputsOnly

      - name: Frozen backend locked release build
        working-directory: backend
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\build_backend_exe.ps1 -Clean

      - name: Frozen Desktop Manager locked release build
        working-directory: backend
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File ..\desktop\scripts\build_manager_exe.ps1 -Clean

      - name: Prepare pinned installer vendor inputs
        working-directory: backend
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\prepare_windows_installer_vendor.ps1 -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\prepare_windows_build_toolchain.ps1 -Component Inno -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile authoritative Inno installer
        id: compile_installer
        working-directory: backend
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -InstallerHashOutputFile "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify atomic Windows installer publish unit
        working-directory: backend
        env:
          INSTALLER_EXPECTED_SHA256: ${{ steps.compile_installer.outputs.installer_sha256 }}
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -VerifyOnly -ExpectedInstallerSha256 "$env:INSTALLER_EXPECTED_SHA256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve verified Windows installer publish path
        working-directory: backend
        run: |
          $versionText = Get-Content -LiteralPath app\version.py -Raw -Encoding UTF8
          $versionMatch = [regex]::Match($versionText, '(?m)^\s*BACKEND_VERSION\s*=\s*"([^"]+)"\s*$')
          if (-not $versionMatch.Success) { throw "Cannot resolve installer publish version." }
          $publishPath = "dist/installer/Ticketbox-Setup-$($versionMatch.Groups[1].Value)"
          if (-not (Test-Path -LiteralPath $publishPath -PathType Container)) {
            throw "Verified installer publish path is missing: $publishPath"
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "INSTALLER_PUBLISH_PATH=backend/$publishPath" + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Upload atomic Windows installer publish unit
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: ticketbox-windows-installer
          path: ${{ env.INSTALLER_PUBLISH_PATH }}
          if-no-files-found: error

      - name: Create fresh installer verification directory
        working-directory: backend
        run: |
          $downloadRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $downloadPath = Join-Path $downloadRoot ("ticketbox-installer-verify-" + [Guid]::NewGuid().ToString("N"))
          if (Test-Path -LiteralPath $downloadPath) { throw "Installer verification directory already exists." }
          New-Item -ItemType Directory -Path $downloadPath -ErrorAction Stop | Out-Null
          if (@([System.IO.Directory]::EnumerateFileSystemEntries($downloadPath)).Count -ne 0) {
            throw "Installer verification directory is not empty."
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "INSTALLER_VERIFY_DOWNLOAD_PATH=$downloadPath" + [Environment]::NewLine,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Download uploaded Windows installer publish unit
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: ticketbox-windows-installer
          path: ${{ env.INSTALLER_VERIFY_DOWNLOAD_PATH }}

      - name: Verify uploaded Windows installer bytes
        working-directory: backend
        env:
          INSTALLER_EXPECTED_SHA256: ${{ steps.compile_installer.outputs.installer_sha256 }}
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging\build_inno_installer.ps1 -VerifyOnly -ExpectedInstallerSha256 "$env:INSTALLER_EXPECTED_SHA256" -VerifyPublishDirectory "$env:INSTALLER_VERIFY_DOWNLOAD_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The business pytest suite AND the end-to-end smoke run on PostgreSQL in the
      # backend-postgres job below (PG-only — debt #4): the SQLite engine is
      # retired, so neither a bare `pytest` nor the threaded smoke server can run
      # here without a cluster, which this job has none of. backend-full keeps
      # the static checks only.

      - name: API contract
        working-directory: backend
        run: .\.ci-venv\Scripts\python.exe scripts\check_api_contract.py

      - name: Resolve release audit base
        env:
          ADR_MANUAL_BASE: ${{ inputs.adr_base_ref }}
          ADR_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $auditBase = $env:ADR_MANUAL_BASE
          }
          elseif ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main") {
            $auditBase = $env:ADR_PUSH_BEFORE
          }
          elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            $auditBaseCandidates = @(git merge-base --all HEAD refs/remotes/origin/main)
            if ($LASTEXITCODE -ne 0 -or $auditBaseCandidates.Count -ne 1) {
              throw "Cannot resolve one unique canonical work-branch audit base."
            }
            $auditBase = ([string]$auditBaseCandidates[0]).Trim()
          }
          else { throw "Unsupported release audit event: $env:GITHUB_EVENT_NAME" }
          if ($auditBase -notmatch '^[0-9a-fA-F]{40,64}$') { throw "Release audit base is not an exact object ID." }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "XPJ_AUDIT_BASE_REF=$auditBase" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))

      - name: Release audit
        working-directory: backend
        env:
          XPJ_RELEASE_AUDIT_COMPACT: "1"
          XPJ_AUDIT_DEFAULT_REF: refs/remotes/origin/main
        run: .\.ci-venv\Scripts\python.exe scripts\release_audit.py

      - name: Dependency vulnerability scan
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: |
          .\.ci-venv\Scripts\python.exe -m pip install pip-audit
          .\.ci-venv\Scripts\python.exe -m pip_audit --strict --vulnerability-service osv -r requirements.txt -r requirements-dev.txt -r ../desktop/requirements.txt

  backend-postgres:
    name: Backend (PostgreSQL)
    # PG-only (debt #4): PostgreSQL is the only engine, so this lane runs the
    # full pytest suite + the end-to-end smoke on it; backend-full above runs
    # static checks only (no DB server). The original lane was
    # .github/workflows/ci.yml on a Linux runner with a
    # postgres service container — dead since the GitHub→Gitea move. The gitea
    # runner is Windows + no Docker, so the shared test-cluster lifecycle starts
    # a marker-owned PostgreSQL on port 5433. Local and CI callers use the same
    # ownership, identity, provisioning, and teardown contract.
    runs-on: windows-latest
    # Step ceilings reserve a separate cleanup window. A lane timeout must not
    # consume the entire job budget and prevent the always() backstop running.
    timeout-minutes: 50

    defaults:
      run:
        working-directory: backend
        shell: powershell

    steps:
      - name: Checkout (offline — local Gitea, no github.com)
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          $ws = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $ws | Out-Null
          Get-ChildItem -LiteralPath $ws -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          git init -q $ws
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          $server = $env:GITHUB_SERVER_URL.TrimEnd('/')
          $origin = "$server/$env:GITHUB_REPOSITORY.git"
          if (@(git -C $ws remote) -contains "origin") {
            git -C $ws remote set-url origin $origin
          } else {
            git -C $ws remote add origin $origin
          }
          if ($LASTEXITCODE -ne 0) { throw "git remote setup failed" }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:REPO_TOKEN"))
          git -C $ws -c "http.extraheader=AUTHORIZATION: basic $b64" -c protocol.version=2 fetch -q --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          if ($LASTEXITCODE -ne 0) { throw "git fetch from local Gitea failed" }
          git -C $ws checkout -q -f $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git checkout $env:GITHUB_SHA failed" }
          git -C $ws log --oneline -1

      - name: Verify Gitea runner lifecycle contract
        timeout-minutes: 2
        run: .\scripts\assert_gitea_runner_contract.ps1

      - name: Install backend dependencies
        timeout-minutes: 10
        run: |
          if (Test-Path .ci-venv) { Remove-Item -Recurse -Force .ci-venv }
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.ci-venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: PostgreSQL lane — ephemeral cluster + smoke + suite
        timeout-minutes: 25
        # The shared lifecycle spins a throwaway PG on :5433, isolated from the
        # prod cluster on :5432. start + smoke + suite + stop run in ONE
        # step with the stop in a finally so the disposable postmaster cannot
        # outlive its owning test transaction. The atomic launcher restricts
        # inherited handles to its explicit log/stdin set. xpj_test (suite) is
        # separate from xpj_smoke so the smoke's rows never collide.
        run: |
          $pgport = 5433
          $datadir = Join-Path $env:TEMP "xpj_pg_ci_$pgport"
          $lifecycleWaitSeconds = 120
          . .\scripts\test_pg_cluster_contract.ps1
          $consumerLease = $null
          try {
            $consumerLease = .\scripts\start_test_pg.ps1 -Purpose ci -Port $pgport -DataDir $datadir -ResetDatabases -AcquireConsumerLease -LifecycleMutexTimeoutSeconds $lifecycleWaitSeconds
            if ($null -eq $consumerLease) { throw "PostgreSQL start did not return its consumer lease" }
            try {
              if ($env:XPJ_TEST_DATABASE_URL -notmatch '/xpj_test$') {
                throw "PostgreSQL start did not publish its exact database URL"
              }
              # smoke_test.py begins with the credential + live cluster authority proof.
              $env:SMOKE_DATABASE_URL = $env:XPJ_TEST_DATABASE_URL -replace '/xpj_test$', '/xpj_smoke'

              # End-to-end smoke: bootstrap -> upload -> OCC-token confirm against real
              # PG. Proves create_all + Alembic replay (incl. 20260606_0001) works on
              # the PostgreSQL engine.
              Write-Host "--- PostgreSQL end-to-end smoke ---"
              .\.ci-venv\Scripts\python.exe scripts\smoke_test.py
              if ($LASTEXITCODE -ne 0) { throw "PostgreSQL smoke failed" }

              # Backup/restore recovery drill (ENGINEERING_RULES section 6: a backup
              # without a restore drill is no backup). Dumps the smoke-populated DB
              # through the real backend backup code (pg_dump -Fc via find_pg_binary),
              # validates the archive, restores into the fresh xpj_restore DB and
              # asserts identical row counts.
              Write-Host "--- PostgreSQL backup/restore drill ---"
              $env:DRILL_SOURCE_URL = $env:XPJ_TEST_DATABASE_URL -replace '/xpj_test$', '/xpj_smoke'
              $env:DRILL_RESTORE_URL = $env:XPJ_TEST_DATABASE_URL -replace '/xpj_test$', '/xpj_restore'
              .\.ci-venv\Scripts\python.exe scripts\postgres_backup_drill.py
              if ($LASTEXITCODE -ne 0) { throw "PostgreSQL backup/restore drill failed" }

              # Ordinary tests run through worker-owned xpj_test_gwN databases.
              # Committed-state/schema/process tests stay in one explicit serial lane.
              Write-Host "--- PostgreSQL parallel pytest lane ---"
              .\.ci-venv\Scripts\python.exe scripts\run_test_lanes.py parallel
              if ($LASTEXITCODE -ne 0) { throw "PostgreSQL parallel pytest lane failed" }
              Write-Host "--- PostgreSQL stateful serial pytest lane ---"
              .\.ci-venv\Scripts\python.exe scripts\run_test_lanes.py stateful
              if ($LASTEXITCODE -ne 0) { throw "PostgreSQL stateful serial pytest lane failed" }
            }
            finally {
              if ($null -ne $consumerLease) {
                Exit-XpjTestPostgresConsumerLease $consumerLease
                $consumerLease = $null
              }
            }
          }
          finally {
            if ($null -ne $consumerLease) {
              Exit-XpjTestPostgresConsumerLease $consumerLease
            }
            if (Test-Path -LiteralPath $datadir) {
              .\scripts\stop_test_pg.ps1 -Purpose ci -Port $pgport -DataDir $datadir -LifecycleMutexTimeoutSeconds $lifecycleWaitSeconds
            }
            $global:LASTEXITCODE = 0
            Write-Host "ephemeral PostgreSQL torn down"
          }

      - name: Stop ephemeral PostgreSQL (backstop)
        timeout-minutes: 4
        if: always()
        # The lane step's finally already stops PG on the normal + failure paths
        # (required so the postmaster is gone before that step's I/O drain). This
        # only recovers after an abnormal kill (e.g. job timeout) that skipped
        # the finally. The same fail-closed ownership contract still applies.
        run: |
          $datadir = Join-Path $env:TEMP "xpj_pg_ci_5433"
          $cleanupWaitSeconds = 30
          $cleanupProcessSeconds = 15
          .\scripts\stop_test_pg.ps1 -Purpose ci -Port 5433 -DataDir $datadir -LifecycleMutexTimeoutSeconds $cleanupWaitSeconds -ProcessTimeoutSeconds $cleanupProcessSeconds

  desktop-manager:
    name: Desktop manager
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop
        shell: powershell

    steps:
      - name: Checkout (offline — local Gitea, no github.com)
        working-directory: ${{ github.workspace }}
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          $ws = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $ws | Out-Null
          Get-ChildItem -LiteralPath $ws -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          git init -q $ws
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          $server = $env:GITHUB_SERVER_URL.TrimEnd('/')
          $origin = "$server/$env:GITHUB_REPOSITORY.git"
          if (@(git -C $ws remote) -contains "origin") {
            git -C $ws remote set-url origin $origin
          } else {
            git -C $ws remote add origin $origin
          }
          if ($LASTEXITCODE -ne 0) { throw "git remote setup failed" }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:REPO_TOKEN"))
          git -C $ws -c "http.extraheader=AUTHORIZATION: basic $b64" -c protocol.version=2 fetch -q --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          if ($LASTEXITCODE -ne 0) { throw "git fetch from local Gitea failed" }
          git -C $ws checkout -q -f $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git checkout $env:GITHUB_SHA failed" }
          git -C $ws log --oneline -1

      - name: Install desktop dependencies
        run: |
          if (Test-Path .ci-venv) { Remove-Item -Recurse -Force .ci-venv }
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.ci-venv\Scripts\python.exe -m pip install -r requirements.txt python-dotenv pytest ruff

      - name: Compile desktop manager
        run: .\.ci-venv\Scripts\python.exe -m compileall backend_manager tests

      - name: Lint desktop manager
        run: .\.ci-venv\Scripts\ruff.exe check backend_manager tests

      - name: Test desktop manager
        run: .\.ci-venv\Scripts\python.exe -m pytest -q

  android-unit:
    name: Android unit/build
    runs-on: windows-latest
    # The single serial runner serves every job: without a ceiling, one
    # wedged R8/KSP build would block all CI for act_runner's ~3h default.
    timeout-minutes: 40

    defaults:
      run:
        working-directory: android
        shell: powershell

    env:
      # From the gitea Actions variable — set it in the gitea repo/org Actions
      # variables (Settings → Actions → Variables) before the next gitea CI run.
      TICKETBOX_SERVER_URL: ${{ vars.TICKETBOX_SERVER_URL }}
      ANDROID_HOME: E:\projects\xiaopiaojia\.toolchains\android-sdk
      ANDROID_SDK_ROOT: E:\projects\xiaopiaojia\.toolchains\android-sdk

    steps:
      - name: Checkout (offline — local Gitea, no github.com)
        working-directory: ${{ github.workspace }}
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          $ws = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path $ws | Out-Null
          Get-ChildItem -LiteralPath $ws -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          git init -q $ws
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          $server = $env:GITHUB_SERVER_URL.TrimEnd('/')
          $origin = "$server/$env:GITHUB_REPOSITORY.git"
          if (@(git -C $ws remote) -contains "origin") {
            git -C $ws remote set-url origin $origin
          } else {
            git -C $ws remote add origin $origin
          }
          if ($LASTEXITCODE -ne 0) { throw "git remote setup failed" }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:REPO_TOKEN"))
          git -C $ws -c "http.extraheader=AUTHORIZATION: basic $b64" -c protocol.version=2 fetch -q --prune --no-recurse-submodules origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          if ($LASTEXITCODE -ne 0) { throw "git fetch from local Gitea failed" }
          git -C $ws checkout -q -f $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git checkout $env:GITHUB_SHA failed" }
          git -C $ws log --oneline -1

      - name: Verify Gitea runner lifecycle contract
        run: ..\backend\scripts\assert_gitea_runner_contract.ps1

      - name: Point Gradle at local Android SDK
        run: |
          if (-not (Test-Path $env:ANDROID_HOME)) {
            throw "Android SDK not found: $env:ANDROID_HOME"
          }
          "sdk.dir=E\:/projects/xiaopiaojia/.toolchains/android-sdk" | Set-Content -Encoding ASCII -Path local.properties
          "ticketbox.serverUrl=$env:TICKETBOX_SERVER_URL" | Add-Content -Encoding ASCII -Path local.properties

      - name: Gradle / JVM versions
        run: .\gradlew.bat --no-daemon --version

      - name: Force regenerate latest Room schema
        # Room's KSP processor is incremental and SKIPS rewriting an existing
        # schemaLocation file when its cache says the entity hash is unchanged
        # — including when the committed file itself is wrong. Deleting the
        # latest version's file turns a silent skip into a loud diff. The
        # delete alone is NOT enough: app/schemas is a legacy KSP arg, not a
        # declared task output, so a FROM-CACHE kspGrayDebugKotlin hit (shared
        # build cache, org.gradle.caching=true) never re-runs the processor
        # and the deleted file stays gone — hence the explicit --rerun-tasks
        # KSP invocation here. The later compile step then sees KSP UP-TO-DATE
        # (net cost ≈ zero). (GitHub-era step, revived + cache-proofed.)
        run: |
          $schemaDir = "app\schemas\com.ticketbox.data.local.AppDatabase"
          $latest = Get-ChildItem $schemaDir -Filter "*.json" |
            Where-Object { $_.BaseName -match '^\d+$' } |
            Sort-Object { [int]$_.BaseName } |
            Select-Object -Last 1
          if ($latest) {
            Write-Host "Deleting $($latest.Name) to force KSP regeneration"
            Remove-Item -LiteralPath $latest.FullName -Force
          }
          .\gradlew.bat --no-daemon :app:kspGrayDebugKotlin --rerun-tasks

      - name: Compile and unit tests
        run: .\gradlew.bat --no-daemon :app:compileGrayDebugKotlin :app:testGrayDebugUnitTest

      - name: Verify Room schema snapshots are committed
        # The regen step above just force-re-emitted the latest schema JSON;
        # if it differs from the committed file the entity change shipped
        # without its schema diff — fail loudly with the patch. Runs from the
        # repo root: with working-directory android, the android/app/schemas
        # pathspec silently matches nothing and the gate "passes" (the
        # GitHub-era lane shipped exactly that bug once).
        working-directory: ${{ github.workspace }}
        run: |
          $status = git status --porcelain android/app/schemas
          if ($status) {
            Write-Host "##[error]Room KSP regenerated schema files that aren't committed."
            Write-Host "git status:"
            Write-Host ($status -join "`n")
            Write-Host "Diff against HEAD:"
            git diff -- android/app/schemas
            $untracked = @($status | Where-Object { $_ -match '^\?\? ' } | ForEach-Object { ($_ -replace '^\?\? ', '').Trim() })
            foreach ($f in $untracked) {
              Write-Host "--- $f"
              Get-Content -LiteralPath $f -Encoding UTF8
              Write-Host "--- end $f"
            }
            throw "Room schema drift — commit the regenerated JSON in the same PR as the entity change"
          }
          Write-Host "Room schema snapshots match the committed files"

      - name: Detect release APK scope
        id: release-apk-scope
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: |
          function Set-ReleaseApkRequired([string]$value) {
            [System.IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              "release_apk_required=$value`n",
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          $eventName = "${{ github.event_name }}"
          $refName = "${{ github.ref_name }}"
          if ($eventName -eq "workflow_dispatch" -or $refName -eq "main") {
            Set-ReleaseApkRequired "true"
            Write-Host "Release APK builds required for main/manual events."
            exit 0
          }

          $changed = @(git diff --name-only origin/main...HEAD)
          if ($LASTEXITCODE -ne 0) {
            $changed = @(git diff --name-only origin/main HEAD)
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to compute changed files against origin/main"
          }
          $changed | ForEach-Object { Write-Host $_ }

          $releaseRelevant = $changed | Where-Object {
            $_ -match '^(android/|\.github/workflows/|\.gitea/workflows/)'
          } | Select-Object -First 1
          if ($releaseRelevant) {
            Set-ReleaseApkRequired "true"
            Write-Host "Release APK builds required by Android/CI changes."
          } else {
            Set-ReleaseApkRequired "false"
            Write-Host "Release APK builds skipped for branch without Android/CI changes."
          }

      - name: Android verification and debug APK builds
        # Keep the same required Gradle gates, but run them in one invocation
        # after the Room schema drift check. On the single Windows runner this
        # avoids paying Gradle configuration + single-use daemon startup six
        # separate times while preserving the same fail-fast behavior.
        #
        # Detekt remains type-resolving (both grayDebug variants). Release
        # builds are path-gated in the next step because R8/minify dominates
        # backend-only PR time while still being required for Android/CI changes.
        run: .\gradlew.bat --no-daemon :app:assertAndroidTestCountEqualsBaseline :app:lintGrayDebug :app:detektGrayDebug :app:detektGrayDebugUnitTest :app:assembleGrayDebug :app:assembleInternalDebug

      - name: Android release APK builds
        if: steps.release-apk-scope.outputs.release_apk_required == 'true'
        # Release builds still run R8 minify + shrinkResources for Android/CI
        # changes. Unsigned release APKs are expected in CI because the release
        # signingConfig is optional.
        run: .\gradlew.bat --no-daemon --max-workers=2 :app:assembleGrayRelease :app:assembleInternalRelease

      - name: Skip Android release APK builds
        if: steps.release-apk-scope.outputs.release_apk_required != 'true'
        run: Write-Host "Release APK builds are path-gated for this branch."

      - name: Verify debug APK signing certificate
        # Both debug APKs must carry the repository-level stable debug
        # certificate (android/config/debug/ticketbox-debug.keystore) so a
        # CI-built APK can adb install -r over any existing debug install.
        # Expected fingerprint pinned from android/config/debug/README.md —
        # if the keystore is ever rotated, update both together.
        run: |
          # Under the runner's $ErrorActionPreference = 'Stop', the 2>&1
          # below would turn the FIRST stderr line apksigner/java ever emits
          # (e.g. a JAVA_OPTIONS notice) into a terminating error before
          # $LASTEXITCODE is consulted. This step's failure handling is
          # entirely explicit (throw + exit-code checks), so relax EAP here.
          $ErrorActionPreference = 'Continue'
          $apksigner = Get-ChildItem "$env:ANDROID_HOME\build-tools\*\apksigner.bat" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Name } -Descending | Select-Object -First 1
          if (-not $apksigner) { throw "apksigner.bat not found under $env:ANDROID_HOME\build-tools" }
          $expected = "911522417cc5016edadcffadde7b904d928dc42d66a797844445acb5bcae106f"
          $apks = @(
            "app\build\outputs\apk\gray\debug\app-gray-debug.apk",
            "app\build\outputs\apk\internal\debug\app-internal-debug.apk"
          )
          foreach ($apk in $apks) {
            # Capture the FULL output before filtering. Piping the .bat
            # straight into Select-Object -First 1 severs the native pipe as
            # soon as the digest line arrives; java then dies writing the
            # remaining cert lines and the .bat exits 1, which the runner
            # epilogue propagates as a step failure AFTER both OKs printed
            # (the first red run failed exactly that way). Capturing also
            # lets us check apksigner's real exit code.
            $out = & $apksigner.FullName verify --print-certs $apk 2>&1
            if ($LASTEXITCODE -ne 0) {
              $out | ForEach-Object { Write-Host $_ }
              throw "apksigner verify failed for $apk (exit $LASTEXITCODE)"
            }
            $line = $out | Select-String -Pattern "certificate SHA-256 digest" | Select-Object -First 1
            if (-not $line) { throw "no SHA-256 digest line from apksigner for $apk" }
            $actual = ($line.Line -split ":\s*", 2)[1].Trim().Replace(":", "").ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Unexpected debug signing certificate for $apk - expected $expected got $actual"
            }
            Write-Host "OK signing certificate $apk"
          }
          exit 0
